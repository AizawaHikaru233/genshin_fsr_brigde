; ============================================================
;  Dx11FsrBridge 正式版配置
;  本桥接管游戏原生 FSR，改用 AMD FFX12 官方 SDK（随包 payload\AMD）执行超分。
;  版本按大版本（4.x/3.x/2.x）自动匹配，SDK 更新无需改本配置。
; ============================================================

[Dx11FsrBridge]

; 本插件总开关：1=开
Enabled=1

; 日志输出：1=写日志文件（排查问题时开启）
EnableLogging=1

; 画面上方悬浮文字提示：1=显示当前 FSR 模式/状态（不干预游戏画面）
ShowOSD=1

; 超分总开关：1=启用本桥的 FSR 超分（接管游戏原生 FSR）
Ffx12=1

; FSR 大版本（ffx12 品牌命名，自动匹配该系列最新可用版本）：
;   ffx12-fsr4.x —— FSR4（推荐。按显卡能力自动识别 + 降级；目前仅 RX 7000/9000 系
;                    独显官方支持 FSR4，其余按能力自动降级 FSR3/FSR2）
;   ffx12-fsr3.x —— FSR3
;   ffx12-fsr2.x —— FSR2
Ffx12Version=ffx12-fsr4.x

; GPU 传输方式：1=纯 GPU（推荐，自建 D3D12 + 共享纹理，无 CPU 中转）
Ffx12GpuInterop=1

; RDNA2 架构独显/核显因兼容性问题对 FSR4 INT8 支持不佳，建议自行获取并替换
; FFX12 SDK 为 4.0.2c 版本（amd_fidelityfx_upscaler_dx12.dll 换为 4.0.2c 内容）。
; 其他非官方 FSR4 支持的显卡可以使用 OptiScaler 切换为 DLSS/XeSS/FSR4 INT8 等超分方案。

; FFX12 SDK DLL 路径（留空=随包 payload\AMD\amd_fidelityfx_upscaler_dx12.dll）
Ffx12DllPath=

; 禁止回退原生（测试用）：1=FSR 接管失败时跳过原始绘制（画面显式异常暴露故障，不静默回退原生）。
;   用于 SDK 缺失/路由错误排查。正常使用保持 0。
Ffx12FailClosed=0

; 日志全开（排查用）：1=跳过白名单过滤，log_line 全量写盘（hook/采集/dispatch/reset 全轨迹）。
;   用于排查"切换渲染精度卡死/崩溃"等疑难问题；正常使用保持 0（精简日志）。
Ffx12FullLogging=0

; ============================================================
;  画面参数（已按本游戏调优，通常无需改动）
; ============================================================
; 自动曝光：1=开（游戏需要，保持开启）
Ffx12AutoExposure=1

; 非线性色彩输入：1=开
Ffx12NonLinear=0

; PQ 色彩链：0=原始直喂（1 会白屏，勿改）
Ffx12PqChain=0

; HDR 输入：1=开
Ffx12Hdr=0

; 运动矢量强度：1.0=标准
Ffx12MotionScale=0.5

; 帧间运动速度因子：50（保持默认）
Ffx12VelocityFactor=50

; 深度方向：1=逆深度（本游戏约定，勿改）
Ffx12DepthInverted=1

; 运动解码：1=开（本游戏 motion 为平方编码，勿改）
Ffx12MotionDecode=1

; 抖动模式：4=推荐；3=备选。其余为诊断值，勿改。
Ffx12JitterMode=4

; 抖动延迟：0=当前帧（推荐）
Ffx12JitterDelay=0

; 运动方向符号：1=正方向（本游戏约定，勿改）
Fsr2MotionVectorScaleMode=1

; 运动矢量已含抖动：0=否（本游戏原版设置，勿改）
Fsr2MotionVectorsJittered=0

; reactive 蒙版：0=关（开启可抑制动态物体历史残留，视画质取舍）
Fsr2UseReactiveMask=0

; 透明度蒙版：0=关
Fsr2UseTransparencyMask=0

; 备用输出复用：0=关（开启会产生残像）
Ffx12ReuseSameGeneration=0

; 相机参数（与游戏投影一致，改动会破坏画面）
Ffx12FovScale=1.0
Ffx12CameraNear=0.5
Ffx12CameraFar=6000.0

; 合成族预处理跳过：1=跳过游戏原生冗余预处理（性能优化，推荐）
Fsr2FamilySkip=1

; il2cpp 钩子：1=开（读取游戏帧/渲染信息，桥接需要）
Fsr2Il2CppHook=1

; ============================================================
;  链路内部参数（值已调优，请勿改动）
; ============================================================
; 游戏原生 jitter 读取的符号修正：3=双符号翻转（本游戏正确约定）。
; 与上方 Ffx12JitterMode（sdk234 生成模式）并存、职责不同，勿混淆。
Fsr2JitterMode=3

; ============================================================
;  游戏内渲染精度菜单
; ============================================================
[RenderScaleMenu]

; 渲染精度菜单总开关：1=开
Enabled=1

; 渲染命令构建函数偏移（新版本适配时才动）
BuildCmdBuffersRva=0x6DE3950

; 渲染精度应用函数偏移（新版本适配时才动）
RenderScaleApplyRva=0xADA0900

; 渲染精度字段偏移（新版本适配时才动）
RenderScaleOffset=0x88

; 源渲染精度值地址（新版本适配时才动）
SourceScaleRva=0x505E5FC

; 渲染精度设置键指针地址（新版本适配时才动）
RenderScaleKeyPointerRva=0x52B1180

; 画质选项查询函数偏移（新版本适配时才动）
GraphicsOptionLookupRva=0x128B8590

; 画质选项索引解析偏移（新版本适配时才动）
GraphicsIndexResolverRva=0xC209120

; 编码浮点编码器偏移（新版本适配时才动）
EncodedFloatEncoderRva=0xA3B56E0

; 下拉显示值刷新函数偏移（新版本适配时才动）
DropdownRefreshShownValueRva=0x17DE5200

; 运行时扫描修复选项标签：1=开
LabelArrayScannerEnabled=1

; 扩展可选档位（0.2~0.9 与原生）：1=开
CandidateListPatchEnabled=1

; 将所选档位应用到实际渲染：1=开
ApplyCandidateSourceScale=1
