; ============================================================
;  Dx11FsrBridge Release Configuration / Dx11FsrBridge 正式版配置
;
;  本文件是**发布模板**：打包与部署流程据此生成随包的 default_config\Dx11FsrBridge.ini，改这里就是改发布默认值。
;  This file is the RELEASE TEMPLATE: the packaging / deployment flow generates the bundled
;  default_config\Dx11FsrBridge.ini from it, so editing here edits the shipped defaults.
;
;  ⚠️ 段名：所有功能键必须在 [Dx11FsrBridge] 段内（代码按段名读取，放错段会**静默读不到**）；日志键在文件末尾的 [Log] / [Log.Categories] 段。
;     Section: every functional key must live under [Dx11FsrBridge] (the code reads by section name; a key in
;     the wrong section is silently ignored). Logging keys live in [Log] / [Log.Categories].
;
;  ⚠️ 本模板只含【功能键】+【日志键】，**不含任何诊断键**：分段性能探针、纹理/着色器追踪与 dump、相似度对比、HDR 与输出路径探针等只存在于**开发构建**中；发布构建已把它们整块剔除（连键名字符串都不在产物里）⇒ 在本文件里找不到它们**是有意为之**，不是丢失或损坏。
;     This template carries functional + logging keys only - NO diagnostic keys. The perf probe, texture / shader tracing
;     and dumps, similarity comparison, and HDR / output-path probes exist in DEVELOPMENT BUILDS only and are excluded
;     wholesale from the release build, so their absence here is intentional.
;
;  ⚠️ 已【移除】的旧键：正式版 DLL 里**连键名都不存在**，写进 ini **没有任何效果**（不影响行为，也不再打印迁移告警）；从旧版升级请把下列旧行从自己的 ini 里删掉：
;       · 透明队列抖动旧键 JitterFlag* 系列（Probe / Force / ProbeFrames / Hotkey）—— 已由 TransparentJitter 取代；
;       · 日志旧键 LogLevel / Ffx12FullLogging / EnableLogging —— 已由 [Log] level 取代（level=off 即等于关闭日志）。
;     The legacy keys listed above were REMOVED - their names are not even present in the release DLL, so writing them has
;     no effect at all (no behaviour change, no migration warning); delete the stale lines from an upgraded ini.
; ============================================================

[Dx11FsrBridge]

; ============================================================
;  1. Core features / 核心功能

; Enabled - 桥总开关；0=关闭，1=开启（默认：1）。
;   Master switch for the bridge; 0 = off, 1 = on (default: 1).
Enabled=1

; Ffx12 - 超分总开关（接管游戏原生 FSR）；0=关闭，1=开启（本文件：1）。⚠️ 代码内建缺省是 0 ⇒ **删掉本行会让桥静默关闭**，正式版必须显式写 1。
;   Enable the bridge's FSR upscaling; 0 = off, 1 = on (this file: 1). ⚠️ The code's built-in fallback is 0,
;   so deleting this line silently disables the bridge - keep the explicit 1.
Ffx12=1

; Ffx12Version - FSR 大版本（ffx12 品牌命名，自动匹配该系列最新可用版本）；取值 ffx12-fsr4.x=FSR4（推荐；仅 RX 7000/9000 系独显官方支持，其余按显卡能力自动降级 FSR3/FSR2）、ffx12-fsr3.x=FSR3、ffx12-fsr2.x=FSR2；默认 ffx12-fsr4.x。
;   FSR series to use (the latest available version is matched automatically); values ffx12-fsr4.x = FSR4 (recommended;
;   only RX 7000/9000 dGPUs officially support it, others degrade automatically), ffx12-fsr3.x = FSR3, ffx12-fsr2.x = FSR2.
Ffx12Version=ffx12-fsr4.x

; Ffx12DllPath - FFX12 SDK DLL 路径；留空=随包 payload\AMD\amd_fidelityfx_upscaler_dx12.dll（默认），也可填绝对/相对路径指向 amd_fidelityfx_upscaler_dx12.dll。
;   Path to the FFX12 SDK DLL; empty = bundled payload\AMD\amd_fidelityfx_upscaler_dx12.dll (default), otherwise a path to it.
Ffx12DllPath=

; RenderScaleMenu - 渲染精度 hook 总开关；0=关闭，1=开启（默认：1）。关闭后桥不启动渲染精度菜单模块（不 hook 菜单文本/渲染命令构建/精度应用，也不扩展候选精度档位）；用途：A/B 验证画面问题是否由桥的渲染精度接管引起，无需卸载。
;   Render-scale hook master switch; 0 = off, 1 = on (default: 1). When off the bridge starts no render-scale menu module and the candidate scale list is NOT extended (for A/B testing without uninstalling).
RenderScaleMenu=1

; ============================================================
;  2. Transparent-queue jitter fix / 透明队列抖动修复 (formal feature, ON by default / 正式功能，默认开启)

; TransparentJitter - 强制透明渲染的抖动开关为 true：劫持 il2cpp 的 Camera.useJitteredProjectionMatrixForTransparentRendering setter，把收到的那个 bool 实参改成 true（只改 setter 序言，不写其它游戏内存），让透明队列物件参与超分的时间重建，修附属效果部件（翅膀水晶羽片/月环）边缘硬阶梯。为什么需要：Unity PostProcessing v2 会把该开关设成 false ⇒ 透明队列用**非抖动**投影矩阵光栅化 ⇒ 采样相位每帧相同、时域累积不到新信息。定位走签名发现（不写死 RVA）、装钩前校验序言、候选不唯一就如实失败、卸载时还原原字节；取值 1=开启（默认，实机已验证），0=关闭（回退游戏原行为）。
;   Forces the transparent-rendering jitter flag to true by overriding that one bool argument (only the setter prologue is touched). Location is by signature discovery (never a hard-coded RVA); the match must be unique, and the original bytes are restored on unload.
;   Values: 1 = on (default, in-game verified), 0 = off (original behaviour).
;   ⚠️ 这是**相机级**开关：强制 true 会把**所有透明物件**一起纳入抖动矩阵（粒子/水面/贴花/半透明服饰）；若在别处看到闪烁/拖影，把本键设为 0。
;   ⚠️ CAMERA-WIDE switch: forcing true pulls EVERY transparent object into the jittered matrix; if you do see
;      flicker or ghosting, set this key to 0.
TransparentJitter=1

; ============================================================
;  3. Draw-entry filter / 绘制入口过滤 (formal feature, ON by default / 正式功能，默认开启)

; DrawEntryFilter - 用钩子**已经拿在手里**的调用实参淘汰不可能是 TAAU 目标的绘制（零 COM 调用）：(DrawIndexed 的 IndexCount | Draw 的 VertexCount) != 3 ⇒ 在查询任何渲染状态之前直接返回。依据是真机元素数直方图（`count == 3` 是**唯一有 hits 的桶**，其余区间 hits 全 0、`outside_hits = 0`）⇒ 绝大多数内省调用可被拒掉，省下的正是那 ~10 fps 的缺口。取值：1=开启（默认）；0=关闭（一律走原路径）。
;   Skips the per-draw introspection when the draw cannot be the TAAU target, using the call argument the hook already
;   has (no COM call): (IndexCount | VertexCount) != 3 => return before any render-state query. Backed by the in-game
;   element-count histogram (`count == 3` is the ONLY bucket with hits). Values: 1 = on (default), 0 = off.
;   ⚠️ 这**不是**代码级等价（两套签名都不检查 element_count，原理上非 3 的绘制仍可能被识别）⇒ 因此自带两条安全机制：
;      ① 自我证伪保险：每次识别成功都校验该绘制的元素数，一旦出现任何一次非 3 的识别成功 ⇒ 单向原子闩锁**永久停用**过滤器并打一行 `draw_entry_filter_disabled reason=non3_identified element_count=N entry=ix|dr`，之后所有绘制走原路径（fail-open：最坏只是退回慢路径，不会漏目标）；
;      ② canary 抽样放行（见 DrawEntryFilterCanary）：让非 3 绘制仍会走到识别处，否则保险永远看不到反例、成了死代码。
;   IMPORTANT - this is NOT code-level equivalence: neither signature inspects element_count, so a non-3 draw could still
;   be identified. Hence two safety mechanisms: (1) self-falsification insurance - a single non-3 identification disables
;   the filter permanently (one-way atomic latch) with the log line above, after which every draw returns to the original
;   slow path (fail-open: never a missed target); (2) canary sampling, without which the insurance could never fire.
DrawEntryFilter=1

; DrawEntryFilterCanary - canary 抽样步长：过滤器生效时每 N 个非 3 绘制仍放行 1 个走**完整**内省路径（标记为 canary），让自我证伪保险真的可观测、真的会响。取值：64=默认；1=所有非 3 绘制都放行（等价于没装过滤器，最保守）；0=一个都不放行（完全信任判据，保险退化为记账 —— 可从漏斗行的 `non3_id=` 看出）。
;   Canary sampling stride: one out of every N non-3 draws is still pushed through the FULL introspection path (marked
;   `canary`), so the self-falsification insurance above can fire. Values: 64 = default; 1 = admit every non-3 draw
;   (equivalent to no filter); 0 = admit none (the insurance degrades to pure bookkeeping).
DrawEntryFilterCanary=64

; ============================================================
;  4. Transport & performance / 传输与性能

; Ffx12GpuInterop - GPU 传输方式；0=CPU 中转，1=纯 GPU（推荐：自建 D3D12+共享纹理，无 CPU 中转）（默认：1）。
;   GPU transport mode; 0 = CPU roundtrip, 1 = pure GPU (own D3D12 + shared texture, no CPU staging) (default: 1).
Ffx12GpuInterop=1

; Ffx12AsyncUpscale - 异步交叠（跨帧交叠）。取值：0=同步（dispatch 内提交+等待+拷贝输出，渲染线程每帧有约 60-100us 硬停，但输出目标与 Present 后缓冲始终一致）；1=异步交叠（dispatch 只提交 FFX，Present 前完成交接，FFX 与游戏后续渲染 GPU 并行，但要求输出目标在 dispatch 与 Present 之间保持不变）。
;   Async overlap. Values: 0 = synchronous (submit + wait + copy inside dispatch; the render thread stalls ~60-100 us per
;   frame); 1 = asynchronous (dispatch only submits FFX, the hand-over completes before Present, and the output target must stay unchanged in between).
;   ⚠️ **本键由安装器 / 芙芙启动器按显卡自动写入**（每次安装或启动重写）：AMD RDNA2（RX 6000 系）→ 0（同步）；其他显卡（NVIDIA / AMD RDNA3+ / Intel Arc 等）→ 1（异步，性能优先）。手动改此值会在下次安装或启动时被自动值覆盖；需长期固定请改安装脚本或启动器的判定逻辑。
;   ⚠️ The installer / launcher rewrites this key on every install or launch based on the GPU (RDNA2 -> 0, else 1).
Ffx12AsyncUpscale=1

; Ffx12SingleInstance - 单实例接管（P1）：游戏同时驱动多个 FSR2 上下文（双相机/画中画）时，本桥的 GPU 互操作层是【全局单份】共享纹理/fence，两条流水线共用会互相把对方的帧混进交付画面（跟随角色剪影的半透明覆盖层）；开启后只接管【一个】实例，其余实例放行走游戏原生上采样。取值：1=开启（默认，只接管一个实例）；0=关闭（全部实例接管）。
;   Single-instance takeover (P1). With the GPU interop layer being a single global set of shared textures / fences, two
;   concurrent FSR2 contexts mix each other's frames into the delivered image (a semi-transparent overlay following the
;   character silhouette); with this ON only ONE instance is taken over, the others run the game's own native upscaler. Values: 1 = on (default), 0 = off (every instance taken over).
;   ⚠️ P2 之后共享层已改成【每实例一份】，所以 0 在原理上不再会互相污染；但 P2 **尚未实机验证** ⇒ 默认仍保持 1（已知安全）。想试全量接管就改成 0：画面正常且日志里每个实例都出现 `ffx12_result rc=DISPATCH_OK` 即可用；再出现覆盖层就改回 1（P1 是 P2 的安全回退）。
Ffx12SingleInstance=1

; Ffx12SingleInstancePick - 接管哪一个实例（Ffx12SingleInstance=1 时生效）。取值：0=自动（默认，render 面积大者优先，面积相同取【最早出现】的实例）；1=强制最早出现的；2=强制最新出现的（改一行即可换成"另一路"，无需重新编译）。若主画面不对，改这一行即可；日志行 `ffx12_single_instance_take` 会同时打印两个实例。
;   Which instance to take over; 0 = automatic (largest render area wins, earliest on a size tie), 1 = always the first
;   seen, 2 = always the last seen. The log line `ffx12_single_instance_take` prints both instances and which was taken.
Ffx12SingleInstancePick=0

; ============================================================
;  P2 diagnostics / experiments (ALL DEFAULT OFF) / P2 诊断与实验开关（**默认全关** ⇒ 默认行为与 P1 完全一致）
;  诊断只写日志；下面两个实验开关**只有显式打开才改变行为**，不做 A/B 就保持 0。
;  Diagnostics only write log lines; the two experiments below change behaviour ONLY when explicitly enabled.

; Ffx12SingleInstanceDiag - 取证开关：把裁决过程与 draw→实例 匹配落日志（≤1 行/秒），用于定位交接棒振荡、只靠 token 认领（视图归属无法区分）等"跟随剪影的短暂覆盖层"的成因；取值 0=关（默认），1=开（仅取证时用，会产生可观日志量）。
;   Evidence switch: logs the takeover election and the draw->instance match (rate-limited to ~1 line/s) for diagnosing
;   hand-over oscillation and token-only claims. Values: 0 = off (default), 1 = on (evidence gathering only).
Ffx12SingleInstanceDiag=0

; Ffx12SingleInstanceSticky - 粘滞裁决（实验）：只要上一任接管者仍在 HoldMs 内被匹配到就不换人（用途：A/B 判定"闪烁是否由交接棒本身引起"）。代价：接管者静默期间没人被超分（放行原生），最长比默认规则多等 (hold_ms - 3000) 毫秒才交棒。取值：0=关（默认，现行为）；1=开（实验）。
;   EXPERIMENT: keep the current taker as long as it is still seen within Ffx12SingleInstanceHoldMs, even if another
;   instance would win the normal election. Cost: while the previous taker is silent NO instance is taken over, so the
;   hand-over can be delayed by up to (hold_ms - 3000) ms. Values: 0 = off (default), 1 = on (experiment).
Ffx12SingleInstanceSticky=0

; Ffx12SingleInstanceHoldMs - 粘滞窗口（毫秒），仅 Ffx12SingleInstanceSticky=1 时生效；钳制到 [3000, 60000]，只有大于 3000 ms 候选窗时才有意义。
;   Sticky window (ms) used by Ffx12SingleInstanceSticky; clamped to [3000, 60000], meaningful only above the 3000 ms window.
Ffx12SingleInstanceHoldMs=10000

; Ffx12SingleInstanceStrictMatch - 严格匹配（实验）：接管者的这一 draw 若**只**靠 token 认领（没有输出归属校验 ⇒ 视图/实例归属无法确认）则判定不可信、不接管，放行游戏原生（fail-open，最多损失那一帧的超分，不会污染 FSR 历史）。取值：0=关（默认）；1=开（实验）。
;   ⚠️ 多义的那一半现已默认处理，但**带安全前提**：接管者已有归属记忆且 500 ms 内尝试过派发才拒绝 ⇒ 建立归属的第一次 bootstrap 与自愈永远放行，拒绝不可能饿死接管者。本键**跳过**这层安全检查：打开它可能重现实机见过的"归属建立不起来 ⇒ 超分停止"死锁。仅用于 A/B。
;   EXPERIMENT: refuse to take over a draw claimed ONLY by a render token, i.e. where ownership cannot be verified.
;   ⚠️ The ambiguous half is now handled by default but ONLY under a safety precondition, and this switch SKIPS that
;   check - enabling it can reproduce the field-observed "ownership never gets established -> upscaling stops" deadlock. A/B only.
Ffx12SingleInstanceStrictMatch=0

; Fsr2FastStateTracking - 状态镜像钩子旁路（正式版性能开关，保持 1）：学到目标像素着色器 hash 之后，资源/常量缓冲/渲染目标/视口四个钩子直接透传，不再逐次内省资源。取值：1=开启（默认，设计意图）；0=每次都内省（很慢，仅用于 A/B 实测对比）。
;   Bypass the state-mirror hooks once the target pixel shader is known (keep at 1). Values: 1 = bypass after
;   learning the target (default, intended), 0 = introspect every state-binding call (slow; A/B measurement only).
Fsr2FastStateTracking=1

; ============================================================
;  5. Frame Parameters / 画面参数 (tuned for this game; normally no change needed / 已按本游戏调优，通常无需改动)

; Ffx12AutoExposure - 自动曝光；0=关闭，1=开启（默认：1。游戏需要，保持开启）。
;   Automatic exposure; 0 = off, 1 = on (default: 1 - the game requires it, keep on).
Ffx12AutoExposure=1

; Ffx12NonLinear - 非线性色彩输入；0=关闭（线性，本文件），1=开启。⚠️ 代码内建缺省是 1 ⇒ 删掉本行会变成 1（画面会破），正式版显式写 0。
;   Non-linear color input; 0 = off (linear, this file), 1 = on. ⚠️ The code fallback is 1, so deleting this line
;   flips it on - keep the explicit 0.
Ffx12NonLinear=0

; Ffx12PqChain - PQ 色彩链；0=原始直喂（默认；1 会白屏，勿改）。
;   PQ color pipeline; 0 = raw feed (default; 1 causes a white screen - do not change).
Ffx12PqChain=0

; Ffx12Hdr - HDR 输入；0=关闭（本文件），1=开启。⚠️ 代码内建缺省是 1 ⇒ 删掉本行会变成 1（画面会破），正式版显式写 0。
;   HDR input; 0 = off (this file), 1 = on. ⚠️ The code fallback is 1, so deleting this line flips it on.
Ffx12Hdr=0

; Ffx12MotionScale - 运动矢量强度；浮点数，1.0=标准（render 尺寸语义，默认）。
;   Motion vector strength; float, 1.0 = standard (render-size semantics, default).
Ffx12MotionScale=1.0

; Ffx12VelocityFactor - 帧间运动速度因子；整数（默认：50，保持默认）。
;   Inter-frame motion velocity factor; integer (default: 50, tuned - keep it).
Ffx12VelocityFactor=50

; Ffx12DepthInverted - 深度方向；0=正深度，1=逆深度（默认：1，本游戏约定，勿改）。
;   Depth direction; 0 = normal depth, 1 = inverted depth (default: 1, this game's convention - do not change).
Ffx12DepthInverted=1

; Ffx12MotionDecode - 运动解码；0=关闭，1=开启（默认：1，勿改）。游戏 motion 确为 R10G10B10A2 平方编码，raw 变体（0）量纲错误、实测会大幅加剧闪烁（所有切线明显的线条都闪）。
;   Motion decoding; 0 = off, 1 = on (default: 1 - do not change). The game's motion really is R10G10B10A2 squared encoding; the raw variant has the wrong dimensions and greatly worsens flicker in game.
Ffx12MotionDecode=1

; Ffx12JitterMode - 抖动模式。取值：3=零中心 -(norm*width)+0.5（默认，推荐）；4=偏置 -(norm*width)（恒定 -0.5px 偏置）；0=偏置 +(norm*width)-0.5；1=反号 +norm*width；2=原始归一化（≈无抖动）；5=零抖动（诊断）。
;   ⚠️ **勿改回 4**：4 的值域是 [-1,0]、恒定带 -0.5px 偏置，时域历史会朝错误方向累积（DLSS M/L 表现为网格黑线，其它模型上表现为高对比边缘闪烁）；这是 v2.0.0 起的已知缺陷。
;   Jitter generation mode; 3 = zero-centred (default, recommended), 4 = constant -0.5 px bias, 0 = offset +0.5, 1 = inverted
;   sign, 2 = raw normalized (~no jitter), 5 = zero jitter (diagnostic). ⚠️ Do NOT change back to 4: its range is [-1,0] with a constant
;   -0.5 px bias, so the temporal history accumulates in the wrong direction.
Ffx12JitterMode=3

; Ffx12JitterDelay - 抖动延迟；整数值，0=当前帧（默认，推荐）。
;   Jitter delay in frames; 0 = current frame (default, recommended).
Ffx12JitterDelay=0

; Ffx12FovScale / Ffx12CameraNear / Ffx12CameraFar - 相机参数（与游戏投影一致，改动会破坏画面）；浮点数，本模板：1.0 / 0.5 / 6000.0（勿改）。
;   Camera parameters (must match the game projection; changing them breaks the image); floats, this file: 1.0 / 0.5 / 6000.0 - do not change.
;   ⚠️ Ffx12CameraNear 的代码内建缺省是 0.25，本模板显式写 0.5 —— 两者不同，所以**不要删掉本行**（删了会退回 0.25）；改动前请先确认画面。
;   ⚠️ Ffx12CameraNear's built-in code fallback is 0.25 while this template sets 0.5 explicitly - do not delete.
Ffx12FovScale=1.0
Ffx12CameraNear=0.5
Ffx12CameraFar=6000.0

; ============================================================
;  6. FSR2 input / masks / compositing family / FSR2 输入、蒙版与合成族

; Fsr2MotionVectorScaleMode - 运动方向符号；0=反方向，1=正方向（默认：1，本游戏约定，勿改）。依据：游戏原生重投影 = UV − mv_g，桥解码出的 mv_sample = −mv_g ⇒ scale 必须为正，否则有效运动方向被翻回 mv_g，历史重投影全反、AA 退化为单帧放大（锯齿）。
;   Motion vector direction sign; 0 = negative, 1 = positive (default: 1, this game's convention - do not change),
;   because the game reprojects as UV - mv_g while the bridge decodes mv_sample = -mv_g.
Fsr2MotionVectorScaleMode=1

; Fsr2MotionVectorsJittered - 运动矢量是否已含抖动；0=否（默认，本游戏原版设置，勿改），1=是。
;   Whether the motion vectors already contain jitter; 0 = no (default, game original setting - do not change).
Fsr2MotionVectorsJittered=0

; Fsr2JitterMode - 游戏原生 jitter 读取的符号修正；3=双符号翻转（默认，本游戏正确约定）。与上方 Ffx12JitterMode 职责不同，勿混淆。
;   Sign correction for the game's native jitter read; 3 = double sign flip (default). Distinct from
;   Ffx12JitterMode above - the two are not the same setting.
Fsr2JitterMode=3

; Fsr2UseReactiveMask - reactive 蒙版；0=关（本文件，=原版行为），1=开（可抑制动态物体历史残留，视画质取舍）。⚠️ 代码内建缺省是 1 ⇒ 删掉本行会变成 1（画面会破），正式版显式写 0。
;   Reactive mask; 0 = off (this file, = original behaviour), 1 = on. ⚠️ The code fallback is 1, so deleting
;   this line flips it on - keep the explicit 0.
Fsr2UseReactiveMask=0

; Fsr2UseTransparencyMask - 透明度蒙版；0=关（默认），1=开。
;   Transparency mask; 0 = off (default), 1 = on.
Fsr2UseTransparencyMask=0

; Fsr2FamilySkip - 合成族预处理跳过；1=跳过游戏原生冗余预处理（本文件，性能优化，推荐），0=不跳过。
;   ⚠️ 代码内建缺省是 0 ⇒ 删掉本行会失去该优化；正式版显式写 1。本优化在【单实例接管】（Ffx12SingleInstance=1）下会**自动关闭**：只要本进程出现过第二个 FSR2 实例（多机位/画中画/UI 上下文），跳过的前提"每次累积 pass 都被桥替换"就不成立 —— 另一路走的是游戏原生上采样，它的预处理 pass 必须真的执行，否则那一路原生 FSR2 输入缺失 ⇒ 画面冻在最后一帧。单实例时优化照旧生效；Ffx12SingleInstance=0（全量接管）不受影响。
;   Skip the game's native redundant family preprocessing; 1 = skip (this file, recommended), 0 = do not skip. ⚠️ The code
;      fallback is 0 - keep the explicit 1. This optimisation turns itself OFF under single-instance takeover as soon as a
;      second FSR2 context exists (its pre-passes feed the game's native accumulate pass). Unaffected with Ffx12SingleInstance=0.
Fsr2FamilySkip=1

; Fsr2Il2CppHook - il2cpp 钩子（读取游戏帧/渲染信息，桥接需要）；1=开启（本文件，必需），0=关闭。⚠️ 代码内建缺省是 0 ⇒ **删掉本行会让桥接失效**，正式版必须显式写 1。
;   il2cpp hook (reads game frame / render info; required by the bridge); 1 = on (this file), 0 = off.
;   ⚠️ The code fallback is 0, so deleting this line breaks the bridge - keep the explicit 1.
Fsr2Il2CppHook=1

; Ffx12ReuseSameGeneration - 备用输出复用；0=关（默认；开启会产生残像），1=开。
;   Reuse the same-generation output buffer; 0 = off (default; on causes ghosting), 1 = on.
Ffx12ReuseSameGeneration=0

; Ffx12FeatureFallback - 特征识别兜底；1=运行时特征识别优先 + 已知样本兜底（默认，未识别版本更安全），0=纯特征识别。
;   Feature-detection fallback; 1 = runtime signature detection first with known good samples as a fallback, 0 = pure detection.
Ffx12FeatureFallback=1

; ------------------------------------------------------------
;  可选：国际服（GenshinImpact.exe）RVA 覆盖 —— 打包偏移不同（g_MethodPointers gap 匹配唯一命中），桥**按 exe 名自动选择**（含 GenshinImpact/global 用 Global 值，否则用国服默认值），平时无需填写；下面三行仅作为"需要手工覆盖时"的写法示例。
;  Optional RVA overrides for the international client; the bridge picks these automatically by executable name, and the lines below are examples only.
; ------------------------------------------------------------
; Fsr2Il2CppRenderRvaGlobal=0x06B580D0
; Fsr2Il2CppUcbRvaGlobal=0x06B58060
; Ffx12CameraRvaGlobal=0x06B54420

; ============================================================
;  7. Compatibility notes / 兼容性说明

; RDNA2 架构独显/核显因兼容性问题对 FSR4 INT8 支持不佳，建议自行获取并替换 FFX12 SDK 为 4.0.2c 版本（amd_fidelityfx_upscaler_dx12.dll 换为 4.0.2c 内容）；其他非官方 FSR4 支持的显卡可以使用 OptiScaler 切换为 DLSS/XeSS/FSR4 INT8 等超分方案。
; RDNA2 dGPUs/iGPUs are not well supported by FSR4 INT8 due to compatibility issues; users on RDNA2 may manually replace
; the bundled amd_fidelityfx_upscaler_dx12.dll with the 4.0.2c build. Other GPUs without official FSR4 support can use
; OptiScaler to switch to DLSS / XeSS / FSR4 INT8 upscaling.

[Log]
; ============================================================
;  日志配置（全部日志选项集中在本段与下方 [Log.Categories]）
;  Logging configuration - every logging option lives here and in [Log.Categories] below.
; ============================================================

; level - 全局等级：off / error / warn / info / debug / trace（也接受 0..5：0=off）。设为 off 即完全关闭日志。
;   Global level; also accepts 0..5 (0 = off). level=off disables logging.
level=info

; to_file - 写日志文件（唯一事实来源）；1=开，0=关。
;   Write the log file (single source of truth).
to_file=1

; to_debugger - 同时输出到调试器（DebugView 可见）；带限流（每秒上限固定，不可通过 ini 配置），避免拖慢渲染线程。默认关。
;   Also mirror lines to the debugger (visible in DebugView); rate-limited by a fixed per-second cap. Default off.
to_debugger=0

; truncate_on_start - 每次启动清空日志；0=追加。
;   Truncate the log on every start; 0 = append.
truncate_on_start=1

; max_file_kb / rotate_keep - 超过大小即轮转，保留 N 份（Dx11FsrBridge.log.1/.2...）；max_file_kb=0 表示不轮转。默认 16384 KB（16 MB）/ 保留 2 份。
;   Rotate when the file exceeds this size, keeping N files; max_file_kb=0 disables rotation. Default 16384 KB.
max_file_kb=16384
rotate_keep=2

; queue_capacity - 异步写队列深度（条）；队列满时丢最旧一条并计入 dropped，调用线程永不阻塞。默认 8192；钳制到 [1024, 262144]。只有把 level 开到 debug/trace 且大量分类同时打开时才需要加大。
;   Async write-queue depth; the writer never blocks and drops the oldest entry when full. Default 8192, clamped to [1024, 262144].
queue_capacity=8192

; compat_prefix - 让尚未声明等级的日志行按消息前缀归类到对应分类。默认 0：这类行统一归 core（不会被丢弃）；仅在需要按前缀细分时设为 1。
;   Classify legacy level-less lines by message prefix. Default 0 (they all land in `core`, never dropped).
compat_prefix=0

; ============================================================
;  [Log.Categories] - 按子系统覆盖全局等级（每行 `分类=等级`）
;
;  用法：level 设全局阈值，本段按子系统覆盖，只把某个子系统放开，不必全局 verbose（示例：level=info / [Log.Categories] / probe=debug / upscale=debug）。
;  Usage: level sets the global threshold; this section overrides it per subsystem.
;
;  分类一览 / Categories：
;      core     生命周期/加载/GPU 路由      hook     DXGI/D3D11/il2cpp 钩子
;      config   ini 读取与生效结果          upscale  FSR/FFX 后端与 dispatch
;      menu     渲染精度菜单集成            hdr      HDR/色彩/色调映射
;      coexist  OptiScaler/ReShade/DLSSG    fg       帧生成
;  把某个分类设为 off 可彻底静默它（如 fg=off）。
;  Setting a category to off silences it completely (e.g. fg=off).
; ============================================================
; probe=debug
; upscale=debug
[Log.Categories]
