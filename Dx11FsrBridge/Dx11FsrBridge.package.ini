; ============================================================
;  Dx11FsrBridge Release Configuration / Dx11FsrBridge 正式版配置
;  本文件是发布模板：打包与部署流程据此生成随包的 default_config\Dx11FsrBridge.ini。
; RELEASE TEMPLATE: the packaging / deployment flow generates the bundled default_config\Dx11FsrBridge.ini from it.
;  功能键必须在 [Dx11FsrBridge] 段内，日志键在文件末尾的 [Log] / [Log.Categories] 段。
; Functional keys live under [Dx11FsrBridge]; logging keys in [Log] / [Log.Categories] at the end.
;  组织顺序：一 通用 → 二 后端选择 → 三 FFX(native) 专用 → 四 NGX(DLSS) 专用。
;  Layout: 1 common -> 2 backend -> 3 native-only -> 4 ngx-only.
; ============================================================

[Dx11FsrBridge]

; ---- 一、通用 / Common（native 与 ngx 都生效） ----

; 1.1 总开关 / Master switches

; Enabled - 桥总开关；1=开（默认），0=关。
; Master switch; 1 = on (default), 0 = off.
Enabled=1

; Ffx12 - 超分总开关；1=接管游戏原生 FSR。勿删本行。
; Upscaling master switch; 1 = take over the game FSR. Do not delete this line.
Ffx12=1

; RenderScaleMenu - 渲染精度菜单 hook；1=开（默认），0=关。
; Render-scale menu hook; 1 = on (default), 0 = off.
RenderScaleMenu=1

; 1.2 接管、过滤与旁路 / Takeover, filter, bypass

; TransparentJitter - 透明物件抖动；1=开（默认），0=关（有闪烁/拖影时置 0）。
; Transparent-object jitter; 1 = on (default), 0 = off (use 0 on flicker or ghosting).
TransparentJitter=1

; DrawEntryFilter - 绘制入口过滤；1=开（默认），0=关（一律走原路径）。
; Draw-entry filter; 1 = on (default), 0 = off (all draws take the original path).
DrawEntryFilter=1

; DrawEntryFilterCanary - canary 抽样步长；64=默认，1=全放行，0=全拦截。
; Canary stride; 64 = default, 1 = admit all, 0 = admit none.
DrawEntryFilterCanary=64

; Fsr2FastStateTracking - 状态镜像旁路；1=开（默认），0=每次内省（很慢，仅 A/B）。
; State-mirror bypass; 1 = on (default), 0 = introspect every call (slow, A/B only).
Fsr2FastStateTracking=1

; Fsr2FamilySkip - 跳过游戏原生冗余预处理；1=跳过（默认），0=不跳过。
; Skip the game redundant family preprocessing; 1 = skip (default), 0 = keep it.
Fsr2FamilySkip=1

; Fsr2Il2CppHook - il2cpp 钩子；1=开（默认，必需）。
; il2cpp hook; 1 = on (default, required).
Fsr2Il2CppHook=1

; 1.3 共用画面参数 / Shared frame parameters

; Ffx12MotionScale - 运动矢量强度；1.0=标准（默认）。
; Motion vector strength; 1.0 = standard (default).
Ffx12MotionScale=1.0

; Ffx12DepthInverted - 深度方向；1=逆（默认），0=正。勿改。
; Depth direction; 1 = inverted (default), 0 = normal. Do not change.
Ffx12DepthInverted=1

; Ffx12JitterMode - 抖动模式；3=零中心（默认，推荐），0/1/2/4/5 为其它模式。勿改回 4。
; Jitter mode; 3 = zero-centred (default, recommended); do not go back to 4.
Ffx12JitterMode=3

; Ffx12JitterDelay - 抖动延迟帧数；0=当前帧（默认）。
; Jitter delay in frames; 0 = current frame (default).
Ffx12JitterDelay=0

; Fsr2MotionVectorScaleMode - 运动方向符号；1=正（默认，本游戏约定），0=反。
; Motion direction sign; 1 = positive (default, this game), 0 = negative.
Fsr2MotionVectorScaleMode=1

; Fsr2MotionVectorsJittered - 运动矢量是否已含抖动；0=否（默认，本游戏），1=是。
; Whether motion vectors already contain jitter; 0 = no (default), 1 = yes.
Fsr2MotionVectorsJittered=0

; ---- 二、后端选择 / Backend selector ----

; Ffx12Backend - 超分后端：auto=按显卡型号自动选（RTX 走 ngx，其余走 native，默认）/ native=自带 FFX/FSR / ngx=NVIDIA NGX(DLSS)。
;   只接受精确小写 auto / native / ngx（大小写敏感、不 trim）；缺键=auto，非法值回退 native 并告警 backend_invalid。
;   auto 在拿到显卡型号时落位一次，日志形如 ngx_core backend=ngx auto=ngx vendor=0x10DE gpu="..."。
; Backend: auto = pick by GPU model (RTX -> ngx, others -> native, default) / native = bundled FFX/FSR / ngx = NVIDIA NGX (DLSS).
;   Exact lowercase only; missing = auto, invalid value falls back to native with a backend_invalid warning.
Ffx12Backend=auto

; ---- 三、FFX (native) 专用 / native-only ----

; 3.1 版本与运行时 / Series and runtime

; Ffx12Version - FSR 大版本：ffx12-fsr4.x（默认）/ fsr3.x / fsr2.x。
; FSR series: ffx12-fsr4.x (default) / fsr3.x / fsr2.x.
Ffx12Version=ffx12-fsr4.x

; Ffx12DllPath - FFX SDK DLL 路径；留空=随包 payload\AMD\amd_fidelityfx_upscaler_dx12.dll（默认）。
; FFX SDK DLL path; empty = bundled payload\AMD\amd_fidelityfx_upscaler_dx12.dll (default).
Ffx12DllPath=

; 3.2 传输与实例接管 / Transport and takeover

; Ffx12GpuInterop - 传输方式；1=纯 GPU（默认），0=CPU 中转。
; Transport; 1 = pure GPU (default), 0 = CPU roundtrip.
Ffx12GpuInterop=1

; Ffx12AsyncUpscale - 异步交叠；1=异步（默认），0=同步。安装器/启动器每次按显卡重写（RDNA2 独显=0）。
; Async overlap; 1 = async (default), 0 = sync. Rewritten per GPU on every install/launch (RDNA2 dGPU = 0).
Ffx12AsyncUpscale=1

; Ffx12SingleInstance / Pick - 单实例接管：1=只接管一个（默认），0=全部；Pick：0=自动（默认），1=最早，2=最新。
; Single-instance takeover: 1 = one only (default), 0 = all; Pick: 0 = auto (default), 1 = earliest, 2 = latest.
Ffx12SingleInstance=1
Ffx12SingleInstancePick=0

; Ffx12SingleInstanceDiag - 多实例取证日志（≤1 行/秒）；0=关（默认）。
; Multi-instance evidence log (<=1 line/s); 0 = off (default).
Ffx12SingleInstanceDiag=0

; Ffx12SingleInstanceSticky / HoldMs - 粘滞裁决 1=开（默认 0）与窗口毫秒（默认 10000，钳制 3000~60000）。
; Sticky election 1 = on (default 0) and its window in ms (default 10000, clamped 3000~60000).
Ffx12SingleInstanceSticky=0
Ffx12SingleInstanceHoldMs=10000

; Ffx12SingleInstanceStrictMatch - 严格匹配；0=关（默认），1=开（跳过归属校验）。
; Strict match; 0 = off (default), 1 = on (skips the ownership check).
Ffx12SingleInstanceStrictMatch=0

; 3.3 色彩与曝光 / Color and exposure

; Ffx12AutoExposure / NonLinear / PqChain / Hdr - 自动曝光 / 非线性输入 / PQ 色彩链 / HDR 输入；本文件 1 / 0 / 0 / 0。
;   PqChain=1 会白屏、AutoExposure 勿改；四项勿删。
; Auto exposure / non-linear input / PQ chain / HDR input; this file: 1 / 0 / 0 / 0. PqChain=1 turns the screen white.
Ffx12AutoExposure=1
Ffx12NonLinear=0
Ffx12PqChain=0
Ffx12Hdr=0

; 3.4 运动矢量与相机 / Motion decode and camera

; Ffx12VelocityFactor - 帧间运动速度因子；50（默认）。勿改。
; Inter-frame motion velocity factor; 50 (default). Do not change.
Ffx12VelocityFactor=50

; Ffx12MotionDecode - 运动矢量解码；1=平方解码（默认），0=原始。勿改。
; Motion vector decode; 1 = squared decode (default), 0 = raw. Do not change.
Ffx12MotionDecode=1

; Ffx12FovScale / CameraNear / CameraFar - 相机参数 1.0 / 0.5 / 6000.0，须与游戏投影一致；勿改、勿删。
; Camera parameters 1.0 / 0.5 / 6000.0 must match the game projection; do not change or delete.

; NgxJitterSign - **NGX（DLSS）路径的 jitter 符号**；0=沿用 Ffx12JitterMode 的值（默认，
;   上游行为），1=对 NGX 取反。整数值，仅 0/1。
;
;   为什么单独一项：FFX 与 NGX 对 `Jitter.Offset` 的**方向约定相反**——FFX 是
;   `samplePos = pixel + jitter`，NGX 用 jitter 补偿 `prevUV` 的亚像素采样位置。
;   上游让两条路径共用一个值（`Ffx12JitterMode`），等于让 NGX 收到反向抖动。
;   本项只改 `ngx::dispatch` 的入参副本，**FFX/native 路径不受影响**。
;
;   取值建议：若 DLSS 下出现「K/J 拖影 + M/L 线条抖动，但 FFX 输入正常」，
;   把本项设为 1 做 A/B。改完若画面反而变差则改回 0。
;
; NGX (DLSS) path jitter sign; 0 = reuse Ffx12JitterMode (default, upstream
; behaviour), 1 = negate for NGX only. FFX and NGX define Jitter.Offset with
; opposite directions; this key flips it for the DLSS path alone.
NgxJitterSign=0

; Ffx12JitterDelay - 抖动延迟；整数值，0=当前帧（默认），1=上一帧。
;
Ffx12CameraFar=6000.0

; 3.5 蒙版与输出复用 / Masks and output reuse

; Fsr2UseReactiveMask / TransparencyMask - reactive 蒙版（0=关，本文件；1=抑制动态物体历史残留）与透明度蒙版（0=关，默认）。
; Reactive mask (0 = off, this file; 1 = suppress ghosting on dynamic objects) and transparency mask (0 = off, default).
Fsr2UseReactiveMask=0
Fsr2UseTransparencyMask=0

; Ffx12ReuseSameGeneration / FeatureFallback - 同代输出复用（0=关，默认，开会残像）/ 特征识别兜底（1=开，默认）。
; Same-generation output reuse (0 = off, default, on causes ghosting) / detection fallback (1 = on, default).
Ffx12ReuseSameGeneration=0
Ffx12FeatureFallback=1

; ---- 四、NGX (DLSS) 专用 / ngx-only ----

; 4.1 实现来源 / Implementation source

; NgxProvider - NGX 实现来源：auto（默认，先真 NGX 再外部）/ nvidia / external。只接受精确小写。
;   external 供非 NVIDIA 平台把 DLSS 接口交给 OptiScaler 实现；失败每 5 s 重试，最多 12 次后回落 native。
; NGX implementation source: auto (default: real NGX first, then external) / nvidia / external. Exact lowercase only.
;   external lets a non-NVIDIA platform hand the DLSS interface to OptiScaler; retried every 5 s, up to 12 times.
NgxProvider=auto

; NgxFeatureDirs - 含 nvngx_dlss.dll 的目录（分号分隔）；留空=自动探测（默认）。
; Directories containing nvngx_dlss.dll (semicolon-separated); empty = auto-detect (default).
NgxFeatureDirs=

; NgxApplicationId - NGX 应用标识（非 0 整数，默认 1337；0 会被改回并告警）。
; NGX application id (non-zero integer, default 1337; 0 is forced back with a warning).
NgxApplicationId=1337

; 4.2 HDR 与画质 / HDR and quality

; NgxHdr - HDR 标志：0（强制 SDR，默认）/ 1（强制 HDR）/ auto（自动探测）；也接受 true/on 与 false/off。
;
;   ★ 2026-11-10 实机确认：默认必须是 0，不能用 auto。
;   桥交给 NGX 的是 **PQ 码值**而非线性光，置 IsHDR 会让 DLSS 按 HDR 管线
;   解释这些码值，色调映射与运动补偿判断偏离画面实际内容 ⇒ K 模型走动时大面积拖影。
;   实测：auto(=>IsHDR) create_flags=0xB 有拖影；0(=>SDR) create_flags=0xA 与 FFX 持平。
;
; HDR flag: 0 (force SDR, default) / 1 (force HDR) / auto; true/on and false/off accepted.
;   Default is 0 on purpose: the bridge feeds PQ code values, not linear light, so
;   setting IsHDR makes DLSS read them through the HDR pipeline and the motion
;   compensation diverges - this produced heavy smear on the K preset.
;   Measured: auto -> create_flags=0xB (with IsHDR), smear; 0 -> 0xA, matches FFX.
NgxHdr=0

; NgxRenderPreset - DLSS 渲染预设：0=不设，由 NGX 自选（默认）；10=J 11=K 12=L 13=M；其它值回退 0 并告警。
;   参考：K 在低对比场景有鬼影、L 有角色边缘抖动，故默认 0。
; DLSS render preset: 0 = none, NGX picks (default); 10=J 11=K 12=L 13=M; invalid falls back to 0. K ghosts, L shakes.
NgxRenderPreset=0

; NgxUseReactiveMask - reactive 蒙版；0=关（默认，原版行为），1=开。
; Reactive mask; 0 = off (default), 1 = on.
NgxUseReactiveMask=0

; NgxSetFrameTimeDelta - 是否给 NGX 传帧时间差；1=传（默认），0=不传。
; Pass the frame time delta to NGX; 1 = yes (default), 0 = no.
NgxSetFrameTimeDelta=1

; 4.3 性能 / Performance

; NgxCrossKeyReuse - 跨 key 复用 NGX 实例：1=开（默认），0=关（每次 key 变化都销毁重建）。
;   key 变化但尺寸与格式全等时复用池与 feature，避免「进出角色界面」反复销毁重建；
;   关掉后那条约 0.5 s 的停顿与短暂黑屏会回来（外部实现侧在 ReleaseFeature 里固定等 0.5 s）。
; Reuse the NGX instance across keys: 1 = on (default), 0 = off (destroy and recreate on every key change).
;   Reuses pool and feature when only the key changes but sizes/formats match; 0 brings back that ~0.5 s hitch
;   (the external implementation sleeps 0.5 s inside ReleaseFeature).

; NgxDepthScale - **深度提取的乘数**；正整数，1=不缩放（默认，上游行为），32=常用值。
;
;   深度提取 CS 的算式是 `out = in.x * scale`。游戏用的是**逆深度**，实际值域约
;   `[0, ~0.03]`，而 NGX/DLSS 期望深度覆盖 `[0, 1]`。不缩放时前后景在数值上几乎
;   不可分，DLSS 的 disocclusion 判据会失效，表现是运动残影与时域不收敛。
;
;   同一仓库的 FFX 后端早已按这个结论处理（`g_depth_scale` 的注释写明
;   「不归一化则深度感知/低分辨率 MV 上采样失真 → 视角移动残影」），
;   只是 NGX 路径没有沿用，一直传 1.0。
;
;   这是**量纲**缩放，不改变方向，与 jitter / MV 的符号问题无关。
;   若画面出现前后景层次异常（远景过曝/切割），先调回 1 再试 16。
;
; Depth extraction multiplier; 1 = unscaled (default, upstream behaviour),
; 32 = typical. Game reverse-Z spans ~[0, 0.03] while NGX expects [0, 1].
NgxDepthScale=1
NgxCrossKeyReuse=1

; 4.4 诊断 / Diagnostics

; NgxLogLevel - NGX 日志：0=关 1=error（默认）2=info 3=debug；取证行按 error 打。
; NGX log level: 0 = off, 1 = error (default), 2 = info, 3 = debug; evidence lines log at error.
NgxLogLevel=1

; NgxPassthrough - 直通（只建 feature 不做超分）；0=关（默认），1=开（仅诊断）。
; Passthrough (create the feature, skip upscaling); 0 = off (default), 1 = on (diagnostic only).
NgxPassthrough=0
[Log]
; --- 日志配置（全部日志选项集中在本段与下方 [Log.Categories]）/ Logging configuration - every option lives here and in [Log.Categories] below ---

; level - 全局等级；off / error / warn / info / debug / trace，也接受 0..5（0=off）。level=off 即完全关闭日志。默认 info。
; Global level; off / error / warn / info / debug / trace, also accepts 0..5 (0 = off). level=off disables logging. Default info.
level=info

; to_file - 写日志文件（唯一事实来源）；1=开（默认），0=关。
; Write the log file (single source of truth); 1 = on (default), 0 = off.
to_file=1

; to_debugger - 同时输出到调试器（DebugView 可见）；1=开，0=关（默认）。每秒上限固定，不可通过 ini 配置。
; Also mirror lines to the debugger (visible in DebugView); 1 = on, 0 = off (default). Fixed per-second cap, not configurable.
to_debugger=0

; truncate_on_start - 每次启动清空日志；1=清空（默认），0=追加。
; Truncate the log on every start; 1 = truncate (default), 0 = append.
truncate_on_start=1

; max_file_kb / rotate_keep - 超过大小即轮转，保留 N 份（Dx11FsrBridge.log.1/.2...）；max_file_kb=0 表示不轮转。默认 16384 KB / 2 份。
; Rotate when the file exceeds this size, keeping N files; max_file_kb=0 disables rotation. Default 16384 KB / keep 2.
max_file_kb=16384
rotate_keep=2

; queue_capacity - 异步写队列深度（条）；默认 8192，钳制到 [1024, 262144]。队列满时丢最旧一条（计入 dropped），调用线程永不阻塞。
; Async write-queue depth; default 8192, clamped to [1024, 262144]. When full the oldest entry is dropped (counted as dropped); the caller never blocks.
queue_capacity=8192

; compat_prefix - 尚未声明等级的日志行按消息前缀归类；1=按前缀归类，0=统一归 core（默认，不会被丢弃）。
; Classify legacy level-less lines by message prefix; 1 = classify by prefix, 0 = all land in `core` (default, never dropped).
compat_prefix=0

; --- [Log.Categories] - 按子系统覆盖全局等级（每行 `分类=等级`）/ Per-subsystem override of the global level (one `category=level` per line) ---
;  用法：level 设全局阈值，本段按子系统覆盖（示例：level=info / [Log.Categories] / probe=debug / upscale=debug）。
; Usage: level sets the global threshold; this section overrides it per subsystem.
;  分类一览 / Categories:
;     core     生命周期 / 加载 / GPU 路由      hook      DXGI / D3D11 / il2cpp 钩子
;     config   ini 读取与生效结果              upscale   FSR / FFX 后端与 dispatch
;     menu     渲染精度菜单集成                hdr       HDR / 色彩 / 色调映射
;     coexist  OptiScaler / ReShade / DLSSG    fg        帧生成
;  任一分类设为 off 即彻底静默它（如 fg=off）。
;  Setting a category to off silences it completely (e.g. fg=off).
;  示例 / Example：probe=debug / upscale=debug
[Log.Categories]
