; ============================================================
;  Dx11FsrBridge Release Configuration / Dx11FsrBridge 正式版配置
;
;  本文件是**发布模板**：打包与部署流程据此生成随包的
;  default_config\Dx11FsrBridge.ini，改这里就是改发布默认值。
;  This file is the RELEASE TEMPLATE: the packaging / deployment flow generates
;  the bundled default_config\Dx11FsrBridge.ini from it, so editing here edits
;  the shipped defaults.
;
;  本桥接管游戏原生 FSR，改用 AMD FFX12 官方 SDK（随包 payload\AMD）执行超分。
;  版本按大版本（4.x/3.x/2.x）自动匹配，SDK 更新无需改本配置。
;  The bridge intercepts the game's native FSR and performs upscaling through the
;  AMD FFX12 official SDK (bundled at payload\AMD). The version is auto-matched by
;  major series (4.x/3.x/2.x); SDK updates do not require changing this file.
;
;  多数选项保持默认即可。标注「勿改」的项与游戏画面约定绑定，改动会破坏画面。
;  Most options work well at their defaults. Options marked "do not change" are
;  tied to this game's render conventions - changing them breaks the image.
;
;  ⚠️ 段名：所有键都必须在 [Dx11FsrBridge] 段内（代码按段名读取，放错段会
;     **静默读不到**）；日志键在文件末尾的 [Log] / [Log.Categories] 段。
;     Section: every functional key must live under [Dx11FsrBridge] (the code reads
;     by section name; a key in the wrong section is silently ignored). Logging
;     keys live in [Log] / [Log.Categories] at the end of this file.
;
;  ⚠️ 本模板只含【功能键】+【日志键】，**不含任何诊断键**：
;     分段性能探针、FSR2 输入纹理转储、逐 draw / 纹理 / 着色器追踪与 dump、
;     相似度对比、HDR 与输出路径探针等诊断功能只存在于**开发构建**中；正式
;     发布构建已把它们整块剔除（连键名字符串都不在产物里）。因此在本文件里
;     找不到它们**是有意为之**，不是丢失或损坏；确需诊断请改用开发构建。
;     This template carries functional keys and logging keys only - NO diagnostic
;     keys. The segmented performance probe, the FSR2 input-texture dump, per-draw
;     / texture / shader tracing and dumps, the similarity comparison, and the
;     HDR / output-path probes exist in DEVELOPMENT BUILDS only; the release build
;     excludes them wholesale (their key strings are not even in the binary).
;     Their absence here is intentional - use a development build for diagnostics.
;
;  ⚠️ 已【移除】的旧键：正式版 DLL 里**连键名都不存在**，写进 ini **没有任何效果**
;     —— 既不影响任何行为，也不会再打印迁移告警（兼容读取层已随源码一并删除）。
;     新装用户请只用下面列出的键；从旧版升级的用户请把下列旧行从自己的 ini 里删掉：
;       · 透明队列抖动旧键 JitterFlag* 系列（Probe / Force / ProbeFrames / Hotkey）
;         —— 已由 TransparentJitter 取代（见该键说明）；
;       · 日志旧键 LogLevel / Ffx12FullLogging / EnableLogging
;         —— 已由 [Log] level 取代（level=off 即等于关闭日志）。
;     The legacy keys named below were REMOVED - their names are not even present in
;     the release DLL, so writing them has no effect at all (no behaviour change and
;     no migration warning). Use TransparentJitter / [Log] level instead, and delete
;     the stale lines from an ini upgraded from an older version.
; ============================================================

[Dx11FsrBridge]

; ============================================================
;  1. Core features / 核心功能
; ============================================================

; Enabled - master switch for the bridge.
;   Values: 0 = off, 1 = on (default: 1)
; 总开关：0=关闭，1=开启（默认：1）
Enabled=1

; Ffx12 - enable the bridge's FSR upscaling (intercepts the game native FSR).
;   Values: 0 = off, 1 = on (this file: 1)
;   ⚠️ 代码内建缺省是 0 ⇒ **删掉本行会让桥静默关闭**，正式版必须显式写 1。
;   ⚠️ The code's built-in fallback is 0, so deleting this line silently disables
;      the bridge - keep the explicit 1 in the release template.
; 超分总开关：0=关闭，1=启用本桥的 FSR 超分（接管游戏原生 FSR）（本文件：1）
Ffx12=1

; Ffx12Version - FSR series to use (ffx12 branding; the latest available version
;   of the series is matched automatically).
;   Values: ffx12-fsr4.x = FSR4 (recommended; auto-detects GPU capability and
;                           degrades; only RX 7000/9000 dGPUs officially support
;                           FSR4, others degrade to FSR3/FSR2 automatically)
;           ffx12-fsr3.x = FSR3
;           ffx12-fsr2.x = FSR2
;   Default: ffx12-fsr4.x
; FSR 大版本（ffx12 品牌命名，自动匹配该系列最新可用版本）：
;   可选值：ffx12-fsr4.x = FSR4（推荐；按显卡能力自动识别+降级，目前仅 RX 7000/9000
;                         系独显官方支持 FSR4，其余按能力自动降级 FSR3/FSR2）
;           ffx12-fsr3.x = FSR3
;           ffx12-fsr2.x = FSR2
;   默认：ffx12-fsr4.x
Ffx12Version=ffx12-fsr4.x

; Ffx12DllPath - path to the FFX12 SDK DLL.
;   Values: empty = bundled payload\AMD\amd_fidelityfx_upscaler_dx12.dll (default)
;           any absolute or relative path to amd_fidelityfx_upscaler_dx12.dll
;  FFX12 SDK DLL 路径：留空 = 随包 payload\AMD\amd_fidelityfx_upscaler_dx12.dll（默认）；
;  也可填绝对/相对路径指向 amd_fidelityfx_upscaler_dx12.dll
Ffx12DllPath=

; RenderScaleMenu - render-scale hook master switch.
;   Values: 0 = off, 1 = on (default: 1)
;   When off the bridge does not start the render-scale menu module at all:
;   no hooks on the menu labels / render-command builder / render-scale apply,
;   and the candidate scale list is NOT extended - the game keeps its native
;   render-scale options. Useful for A/B testing whether a visual issue comes
;   from the bridge's render-scale integration, without uninstalling.
; 渲染精度 hook 总开关：0=关闭，1=开启（默认：1）。
;   关闭后桥完全不启动渲染精度菜单模块——不 hook 菜单文本 / 渲染命令构建 /
;   精度应用，也不扩展候选精度档位，游戏保持原生渲染精度档位与行为。
;   用途：A/B 验证画面问题是否由桥的渲染精度接管引起，无需卸载。
RenderScaleMenu=1

; ============================================================
;  2. Transparent-queue jitter fix / 透明队列抖动修复
;     (formal feature, ON by default / 正式功能，默认开启)
; ============================================================

; TransparentJitter - force the transparent-rendering jitter flag to true.
;   Hooks the il2cpp setter of
;   Camera.useJitteredProjectionMatrixForTransparentRendering and overrides the
;   single bool argument it receives (false -> true). Nothing else is touched:
;   no game memory is written apart from that one setter prologue.
;   Why it is needed: Unity PostProcessing v2 sets that flag to false, so the
;   transparent queue is rasterised with the NON-jittered projection matrix ->
;   the screen-space sampling phase is identical every frame -> temporal
;   upscaling accumulates no new information -> hard stair-stepping on the
;   edges of character-attached effect parts (wings crystal feathers / moon
;   ring). Forcing true lets those objects take part in temporal reconstruction.
;   Location is by signature discovery (never a hard-coded RVA), the setter
;   prologue is verified before patching, installation fails honestly when the
;   match is not unique, and the original bytes are restored on unload.
;   Values: 1 = on (default; verified in game), 0 = off (original behaviour)
;   作用：强制 il2cpp setter 收到的那个 bool 实参为 true，让透明队列物件参与超分的
;   时间重建，修附属效果部件（翅膀水晶羽片 / 月环）边缘硬阶梯。
;   定位走签名发现（不写死 RVA）、装钩前校验序言、候选不唯一就如实失败、卸载时还原原字节。
;   取值：1=开启（默认，实机已验证），0=关闭（回退游戏原行为）。
;   NOTE - this is a CAMERA-WIDE switch: forcing true pulls EVERY transparent
;   object into the jittered matrix (particles, water, decals, translucent
;   cloth). In-game A/B showed no obvious regression; if you do see flicker or
;   ghosting on such objects, set this key to 0.
;   ⚠️ 这是**相机级**开关：强制 true 会把**所有透明物件**一起纳入抖动矩阵
;   （粒子/水面/贴花/半透明服饰）。实机 A/B 未发现明显劣化；若在别处看到闪烁/拖影，
;   把本键设为 0。
TransparentJitter=1

; ============================================================
;  3. Draw-entry filter / 绘制入口过滤
;     (formal feature, ON by default / 正式功能，默认开启)
; ============================================================

; DrawEntryFilter - skip the per-draw introspection when the draw cannot be the
;   TAAU target, using the call argument the hook already has (no COM call at all).
;   Predicate: (IndexCount for DrawIndexed | VertexCount for Draw) != 3 => return
;   immediately, before any render-state query.
;   Why: the in-game element-count histogram (development-build probe output, 4th
;   line) shows the `count == 3` bucket is the ONLY one with hits
;   (`elem_ix 3: 2490/249`, `elem_dr 3: 6997/250`; every other bucket - 6 / 12 /
;   17-31 / ... / 32768+ - has zero hits, i.e. `outside_hits=0`). So ~92.2% of the
;   ~121,100 introspection calls per interval can be rejected, which saves
;   ~0.45 us x 490 draws/frame x 92.2% ~= 203 us/frame (the ~10 fps gap).
;   IMPORTANT - this is NOT a code-level equivalence: neither signature inspects
;   `element_count`, so in principle a non-3 draw could still be identified. That
;   is why the filter ships with two safety mechanisms:
;     1) SELF-FALSIFICATION INSURANCE - every identification success checks the
;        element count of that draw. If a single non-3 identification ever happens,
;        the filter is disabled permanently (one-way atomic latch), the log gets
;        `draw_entry_filter_disabled reason=non3_identified element_count=N entry=ix|dr`,
;        and every draw goes back to the original path. It is fail-open: the worst
;        case is the old (slower) behaviour, never a missed target.
;     2) CANARY SAMPLING (see DrawEntryFilterCanary) - without it the insurance
;        could never fire (nothing non-3 would ever reach an identification), which
;        would make it dead code. A small sample of non-3 draws is still pushed
;        through the full path so the insurance can actually observe and react.
;   Values: 1 = on (default, backed by the in-game histogram above),
;           0 = off (always take the original path)
;   作用：用钩子**已经拿在手里**的调用实参淘汰不可能是 TAAU 目标的绘制（零 COM 调用）。
;   判据：(DrawIndexed 的 IndexCount | Draw 的 VertexCount) != 3 ⇒ 在查询任何渲染状态
;   之前直接返回。
;   依据：真机元素数直方图（开发构建的性能探针输出，第 4 行）里 `count==3` 是
;   **唯一有 hits 的桶**（elem_ix 3: 2490/249、elem_dr 3: 6997/250；其余区间 hits 全 0，
;   `outside_hits=0`）⇒ 每区间约 121,100 次内省调用可拒掉约 92.2%，
;   省约 0.45 µs × 490 draws/帧 × 92.2% ≈ 203 µs/帧（正是那 ~10 fps 的缺口）。
;   ⚠️ 这**不是**代码级等价（两套签名都不检查 element_count）⇒ 因此自带两条安全机制：
;   ① 自我证伪保险：每次识别成功都检查该绘制的元素数，一旦出现任何一次非 3 的识别成功
;   ⇒ 永久停用过滤器（单向原子闩锁）+ 打一行醒目的
;   `draw_entry_filter_disabled reason=non3_identified element_count=N entry=ix|dr`，
;   之后所有绘制走原路径（fail-open：最坏只是退回慢路径，不会漏目标）；
;   ② canary 抽样放行（见 DrawEntryFilterCanary）：否则保险永远看不到非 3 的识别、
;   成了死代码 —— 是它让保险真的可观测。
;   取值：1=开启（默认，依据就是上面那份真机直方图）；0=关闭（一律走原路径）。
DrawEntryFilter=1

; DrawEntryFilterCanary - canary sampling stride for the entry filter.
;   While the filter is active, one out of every N non-3 draws is still pushed
;   through the FULL introspection path (marked `canary`). If any of them is
;   identified, the self-falsification insurance above disables the filter.
;   Cost: (rejected ratio / N) x original introspection cost ~= 3 us/frame at the
;   default N=64 (1.5% of the ~203 us/frame saved) - the price of an insurance
;   that can actually fire, and the detection latency is ~N frames.
;   Values: 64 = default; 1 = every non-3 draw is admitted (equivalent to no
;   filter at all - the most conservative setting); 0 = admit none (the filter is
;   then trusted on the strength of the in-game histogram alone, and the insurance
;   degrades to pure bookkeeping - visible as `non3_id=` in the funnel line).
;   作用：过滤器生效时，每 N 个非 3 绘制仍放行 1 个走**完整**内省路径（标记为 canary）。
;   其中任何一个被识别 ⇒ 上面的自我证伪保险立刻停用过滤器。
;   代价：默认 N=64 时 ≈3 µs/帧（占被省下的 203 µs/帧 的 1.5%），换来"保险真的会响"，
;   发现延迟约 N 帧。
;   取值：64=默认；1=所有非 3 绘制都放行（等价于没装过滤器，最保守）；
;   0=一个都不放行（完全信任判据，保险退化为记账 —— 可从漏斗行的 `non3_id=` 看出）。
DrawEntryFilterCanary=64

; ============================================================
;  4. Transport & performance / 传输与性能
; ============================================================

; Ffx12GpuInterop - GPU transport mode.
;   Values: 0 = CPU roundtrip, 1 = pure GPU (recommended: own D3D12 + shared
;           texture, no CPU staging) (default: 1)
; GPU 传输方式：0=CPU 中转，1=纯 GPU（推荐：自建 D3D12+共享纹理，无 CPU 中转）（默认：1）
Ffx12GpuInterop=1

; Ffx12AsyncUpscale - async overlap (跨帧交叠).
;   Values: 0 = 同步：dispatch 内提交+等待+拷贝输出（渲染线程每帧有约 60-100us
;               硬停，但输出目标与 Present 后缓冲始终一致）
;           1 = 异步交叠：dispatch 只提交 FFX，Present 前完成交接——FFX 与游戏
;               后续渲染 GPU 并行（减少渲染线程硬停），但要求输出目标在
;               dispatch 与 Present 之间保持不变
;
;   **本键由安装器 / 芙芙启动器按显卡自动写入**（每次安装或启动重写）：
;     - AMD RDNA2（RX 6000 系）→ 0（同步）
;     - 其他显卡（NVIDIA / AMD RDNA3+ / Intel Arc 等）→ 1（异步，性能优先）
;   手动改此值会在下次安装或启动时被自动值覆盖；需长期固定请改安装脚本或
;   启动器的判定逻辑，而不是只改本文件。
;   NOTE: the installer / launcher rewrites this key on every install or launch
;   based on the GPU (RDNA2 -> 0, everything else -> 1), so a manual edit here is
;   temporary by design.
; 异步交叠：0=同步（RDNA2 默认），1=异步（其他显卡默认）
Ffx12AsyncUpscale=1

; Fsr2FastStateTracking - bypass the state-mirror hooks once the target pixel
;   shader is known (production performance switch; keep at 1).
;   With 1 the PSSetShaderResources / PSSetConstantBuffers / OMSetRenderTargets /
;   RSSetViewports hooks pass straight through after the target PS hash has been
;   learned (no per-call resource introspection), PSSetShader only records a hash,
;   and the target-draw inspection uses a cheap pre-screen. Measured symptom of
;   leaving it off: single-core load up to 80%, GPU idle, and no frame-rate
;   difference between render scale 0.2 and 0.5.
;   Values: 1 = bypass after learning the target (default, intended), 0 = keep
;   introspecting every state-binding call (slow; only for A/B measurement)
; 状态镜像钩子旁路（正式版性能开关，保持 1）：学到目标像素着色器 hash 之后，
;   资源/常量缓冲/渲染目标/视口四个钩子直接透传，不再逐次内省资源。
;   取值：1=开启（默认，设计意图）；0=每次都内省（很慢，仅用于 A/B 实测对比）。
Fsr2FastStateTracking=1

; ============================================================
;  5. Frame Parameters / 画面参数
;     (tuned for this game; normally no change needed)
;     （已按本游戏调优，通常无需改动）
; ============================================================

; Ffx12AutoExposure - automatic exposure (the game requires it; keep on).
;   Values: 0 = off, 1 = on (default: 1)
; 自动曝光：0=关闭，1=开启（游戏需要，保持开启）（默认：1）
Ffx12AutoExposure=1

; Ffx12NonLinear - non-linear color input.
;   Values: 0 = off (linear, this file), 1 = on
;   ⚠️ 代码内建缺省是 1 ⇒ 删掉本行会变成 1；正式版显式写 0 保持线性。
;   ⚠️ code fallback is 1, so deleting this line flips it on - keep the explicit 0.
; 非线性色彩输入：0=关闭（线性，本文件）；1=开启（代码内建缺省是 1，正式版显式关）
Ffx12NonLinear=0

; Ffx12PqChain - PQ color pipeline.
;   Values: 0 = raw feed (default; 1 causes a white screen - do not change)
; PQ 色彩链：0=原始直喂（默认；1 会白屏，勿改）
Ffx12PqChain=0

; Ffx12Hdr - HDR input.
;   Values: 0 = off (this file), 1 = on
;   ⚠️ 代码内建缺省是 1 ⇒ 删掉本行会变成 1；正式版显式写 0。
;   ⚠️ code fallback is 1, so deleting this line flips it on - keep the explicit 0.
; HDR 输入：0=关闭（本文件）；1=开启（代码内建缺省是 1，正式版显式关）
Ffx12Hdr=0

; Ffx12MotionScale - motion vector strength.
;   Values: float; 1.0 = standard (render-size semantics, default)
; 运动矢量强度：浮点数；1.0=标准（render 尺寸语义，默认）
Ffx12MotionScale=1.0

; Ffx12VelocityFactor - inter-frame motion velocity factor.
;   Values: integer (default: 50, tuned)
; 帧间运动速度因子：整数（默认：50，保持默认）
Ffx12VelocityFactor=50

; Ffx12DepthInverted - depth direction.
;   Values: 0 = normal depth, 1 = inverted depth (default: 1, this game
;           convention - do not change)
; 深度方向：0=正深度，1=逆深度（默认：1，本游戏约定，勿改）
Ffx12DepthInverted=1

; Ffx12MotionDecode - motion decoding (this game uses squared encoding).
;   Values: 0 = off, 1 = on (default: 1 - do not change)
;   In-game measurement: 0 (raw variant) greatly worsens flicker on every
;   tangent-visible line - the game's motion really is R10G10B10A2 squared
;   encoding, so the raw variant has the wrong dimensions. Diagnostic only.
; 运动解码：0=关闭，1=开启（默认：1，勿改）。游戏 motion 确为 R10G10B10A2 平方编码，
;   raw 变体（0）量纲错误，实测会大幅加剧闪烁（所有切线明显的线条都闪）。
Ffx12MotionDecode=1

; Ffx12JitterMode - jitter generation mode.
;   Values: 3 = zero-centred  -(norm*width)+0.5   (default, recommended)
;           4 = offset       -(norm*width)        (-0.5px constant bias)
;           0 = offset       +(norm*width)-0.5
;           1 = inverted sign +norm*width
;           2 = raw normalized (~0, equivalent to no jitter)
;           5 = zero jitter (diagnostic)
;   ⚠️ 3 是零中心（值域 [-0.5,+0.5]）；4 的值域是 [-1,0]、恒定带 -0.5px 偏置，
;      时域历史朝错误方向累积（DLSS M/L 表现为网格黑线，其他模型上表现为高对比
;      边缘闪烁）。这是 v2.0.0 起的已知缺陷，**勿改回 4**。
;   ⚠️ Mode 3 is zero-centred; mode 4 carries a constant -0.5 px bias and makes the
;      temporal history accumulate in the wrong direction - do NOT change back to 4.
; 抖动模式：3=零中心（默认，推荐） 4=偏置（恒定 -0.5px，勿改回） 0=偏置（+0.5 偏移）
;           1=反号 2=原始归一化（≈无抖动） 5=零抖动（诊断）
Ffx12JitterMode=3

; Ffx12JitterDelay - jitter delay.
;   Values: integer frames; 0 = current frame (default, recommended)
;   History: 1 (= previous frame's jitter) was tested on 2026-09-18 and made the
;   whole image blurry while the flicker remained, so 0 is the verified value.
; 抖动延迟：整数值；0=当前帧（默认，推荐）。
;   历史：曾改成 1（用上一帧 jitter）实测"画面整体变糊"且闪烁仍在 ⇒ 保持 0。
Ffx12JitterDelay=0

; Ffx12FovScale / Ffx12CameraNear / Ffx12CameraFar - camera parameters
;   (must match the game projection; changing breaks the image).
;   Values: float (this file: 1.0 / 0.5 / 6000.0 - do not change)
;   ⚠️ Ffx12CameraNear 的代码内建缺省是 0.25，本模板显式写 0.5 —— 两者不同，
;      所以**不要删掉本行**（删了会退回 0.25）；改动前请先确认画面。
;   ⚠️ Ffx12CameraNear's built-in code fallback is 0.25 while this template sets
;      0.5 explicitly; the two differ, so do not delete the line.
; 相机参数（与游戏投影一致，改动会破坏画面）：
;   浮点数，本模板：1.0 / 0.5 / 6000.0（勿改）
Ffx12FovScale=1.0
Ffx12CameraNear=0.5
Ffx12CameraFar=6000.0

; ============================================================
;  6. FSR2 input / masks / compositing family
;     FSR2 输入、蒙版与合成族
; ============================================================

; Fsr2MotionVectorScaleMode - motion vector direction sign.
;   Values: 0 = negative, 1 = positive (default: 1, this game convention -
;           do not change)
;   依据：游戏原生重投影 = UV − mv_g，桥解码出的 mv_sample = −mv_g ⇒ scale 必须为正，
;   否则有效运动方向被翻回 mv_g，历史重投影全反、AA 退化为单帧放大（锯齿）。
; 运动方向符号：0=反方向，1=正方向（默认：1，本游戏约定，勿改）
Fsr2MotionVectorScaleMode=1

; Fsr2MotionVectorsJittered - whether the motion vectors already contain jitter.
;   Values: 0 = no (default, game original setting - do not change), 1 = yes
; 运动矢量已含抖动：0=否（默认，本游戏原版设置，勿改），1=是
Fsr2MotionVectorsJittered=0

; Fsr2JitterMode - sign correction for the game's native jitter read.
;   Values: 3 = double sign flip (default, this game's correct convention)
;   Distinct from Ffx12JitterMode above - the two are not the same setting.
; 游戏原生 jitter 读取的符号修正：3=双符号翻转（默认，本游戏正确约定）。
; 与上方 Ffx12JitterMode 职责不同，勿混淆。
Fsr2JitterMode=3

; Fsr2UseReactiveMask - reactive mask (suppresses historical residue on
;   moving objects; trade quality vs artifacts).
;   Values: 0 = off (this file), 1 = on
;   ⚠️ 代码内建缺省是 1 ⇒ 删掉本行会变成 1；正式版显式写 0（=原版行为）。
;   ⚠️ code fallback is 1, so deleting this line flips it on - keep the explicit 0.
; reactive 蒙版：0=关（本文件，=原版行为），1=开（可抑制动态物体历史残留，视画质取舍）
Fsr2UseReactiveMask=0

; Fsr2UseTransparencyMask - transparency mask.
;   Values: 0 = off (default), 1 = on
; 透明度蒙版：0=关（默认），1=开
Fsr2UseTransparencyMask=0

; Fsr2FamilySkip - skip the game's native redundant family preprocessing.
;   Values: 1 = skip (this file, performance optimisation - recommended),
;           0 = do not skip
;   ⚠️ 代码内建缺省是 0 ⇒ 删掉本行会失去该优化；正式版显式写 1。
;   ⚠️ code fallback is 0, so deleting this line loses the optimisation.
; 合成族预处理跳过：1=跳过游戏原生冗余预处理（本文件，性能优化，推荐）；
;   0=不跳过（代码内建缺省是 0，正式版显式开）
Fsr2FamilySkip=1

; Fsr2Il2CppHook - il2cpp hook (reads game frame/render info; required).
;   Values: 1 = on (this file, required for the bridge), 0 = off
;   ⚠️ 代码内建缺省是 0 ⇒ **删掉本行会让桥接失效**；正式版必须显式写 1。
;   ⚠️ code fallback is 0, so deleting this line breaks the bridge - keep the
;      explicit 1.
; il2cpp 钩子（读取游戏帧/渲染信息，桥接需要）：1=开启（本文件，必需）；
;   0=关闭（代码内建缺省是 0，正式版显式开）
Fsr2Il2CppHook=1

; Ffx12ReuseSameGeneration - reuse the same-generation output buffer.
;   Values: 0 = off (default; on causes ghosting), 1 = on
; 备用输出复用：0=关（默认；开启会产生残像），1=开
Ffx12ReuseSameGeneration=0

; Ffx12FeatureFallback - feature-detection fallback.
;   Values: 1 = runtime signature detection first, with known good samples as a
;   fallback (default; safer on an unrecognised build), 0 = pure detection
; 特征识别兜底：1=运行时特征识别优先 + 已知样本兜底（默认，未识别版本更安全）；
;   0=纯特征识别
Ffx12FeatureFallback=1

; ------------------------------------------------------------
;  Optional: RVA overrides for the international client
;  可选：国际服（GenshinImpact.exe）RVA 覆盖
;  打包偏移不同（g_MethodPointers gap 匹配唯一命中）。桥**按 exe 名自动选择**
;  （含 GenshinImpact/global 用 Global 值，否则用国服默认值），平时无需填写；
;  下面三行仅作为"需要手工覆盖时"的写法示例。
;  The bridge picks these automatically by executable name; the lines below are
;  commented-out examples for a manual override only.
; ------------------------------------------------------------
; Fsr2Il2CppRenderRvaGlobal=0x06B580D0
; Fsr2Il2CppUcbRvaGlobal=0x06B58060
; Ffx12CameraRvaGlobal=0x06B54420

; ============================================================
;  7. Compatibility notes / 兼容性说明
; ============================================================

; RDNA2 dGPUs/iGPUs are not well supported by FSR4 INT8 due to compatibility
; issues. Users on RDNA2 may manually replace the bundled FFX12 SDK
; (amd_fidelityfx_upscaler_dx12.dll) with the 4.0.2c build.
; Other GPUs without official FSR4 support can use OptiScaler to switch to
; DLSS / XeSS / FSR4 INT8 upscaling.
; RDNA2 架构独显/核显因兼容性问题对 FSR4 INT8 支持不佳，建议自行获取并替换
; FFX12 SDK 为 4.0.2c 版本（amd_fidelityfx_upscaler_dx12.dll 换为 4.0.2c 内容）。
; 其他非官方 FSR4 支持的显卡可以使用 OptiScaler 切换为 DLSS/XeSS/FSR4 INT8 等超分方案。

[Log]
; ============================================================
;  日志配置（全部日志选项集中在本段与下方 [Log.Categories]）
;  Logging configuration - every logging option lives here and in
;  [Log.Categories] below.
; ============================================================

; level - 全局等级：off / error / warn / info / debug / trace
;   （也接受 0..5：0=off）。设为 off 即完全关闭日志。
;   Global level; also accepts 0..5 (0 = off). level=off disables logging.
level=info

; to_file - 写日志文件（唯一事实来源）
;   Write the log file (single source of truth).
to_file=1

; to_debugger - 同时输出到调试器（DebugView 可见）；带限流（每秒上限固定，
;   不可通过 ini 配置），避免拖慢渲染线程。默认关。
;   Also mirror lines to the debugger (visible in DebugView); rate-limited by a
;   fixed per-second cap that is not configurable through this ini. Default off.
to_debugger=0

; truncate_on_start - 每次启动清空日志；0 = 追加。
;   Truncate the log on every start; 0 = append.
truncate_on_start=1

; max_file_kb / rotate_keep - 超过大小即轮转，保留 N 份（Dx11FsrBridge.log.1/.2...）。
;   max_file_kb=0 表示不轮转。默认 16384 KB（16 MB）/ 保留 2 份。
;   Rotate when the file exceeds this size, keeping N files.
;   max_file_kb=0 disables rotation. Default 16384 KB / keep 2.
max_file_kb=16384
rotate_keep=2

; queue_capacity - 异步写队列深度（条）。队列满时丢最旧一条并计入 dropped，
;   调用线程永不阻塞。默认 8192；钳制到 [1024, 262144]。
;   只有把 level 开到 debug/trace 且大量分类同时打开时才需要加大。
;   Async write-queue depth; the writer never blocks and drops the oldest entry
;   when full. Default 8192, clamped to [1024, 262144].
queue_capacity=8192

; compat_prefix - 让尚未声明等级的日志行按消息前缀归类到对应分类。
;   默认 0：这类行统一归 core（不会被丢弃）。仅在需要按前缀细分时设为 1。
;   Classify legacy level-less lines by message prefix. Default 0 (they all land
;   in `core` and are never dropped).
compat_prefix=0

; ============================================================
;  [Log.Categories] - 按子系统覆盖全局等级（每行 `分类=等级`）
;
;  Usage / 用法：
;    level sets the global threshold; this section overrides it per subsystem,
;    so you can drill into one area without going verbose globally:
;      level=info
;      [Log.Categories]
;      probe=debug
;      upscale=debug
;    全局等级 + 按子系统覆盖：只把某个子系统放开，不必全局 verbose。
;
;  Categories / 分类一览：
;      core     生命周期/加载/GPU 路由      hook     DXGI/D3D11/il2cpp 钩子
;      config   ini 读取与生效结果          upscale  FSR/FFX 后端与 dispatch
;      menu     渲染精度菜单集成            hdr      HDR/色彩/色调映射
;      coexist  OptiScaler/ReShade/DLSSG    fg       帧生成
;  Setting a category to off silences it completely (e.g. fg=off).
;  把某个分类设为 off 可彻底静默它（如 fg=off）。
; ============================================================
; probe=debug
; upscale=debug
[Log.Categories]
