name: Build GitHub Release Package

# 说明：
#   本 workflow 手动构建**面向 GitHub 的发布包**：
#     - 触发方式：仅 workflow_dispatch（手动 Run workflow），不随 push / PR 自动运行
#     - 构建命令：./Build-OnlineInstaller.ps1 -Configuration Release -GithubOnly
#     - 构建产物：dist/github-release/GenshinFSRBridge_v<version>.7z
#     - 上传 artifact 名：GenshinFSRBridge-Package
#     - 可选发布：publish_release=true 且填 release_tag 时，用 softprops/action-gh-release
#       把该 7z 发到对应 tag 的 GitHub Release
#
#   文件名说明：本文件名沿用自一个**已移除的旧包概念**（历史上的 "Lite 包"），
#   本 workflow 与该旧概念无关 —— 它只产出上面那一个 7z。
#
#   ⚠️ 关键前置：Dx11FsrBridge 的 CMake 配置需要 AMD FidelityFX SDK 头文件
#   （Dx11FsrBridge/CMakeLists.txt 第 13-37 行，默认取
#    OptiScaler-src/external/FidelityFX-SDK-v2/Kits/FidelityFX）。
#   该 SDK 因许可（"binary form only" 再分发限制）**未 vendor 进本仓库**，
#   且 OptiScaler-src/ 被 .gitignore → 全新检出没有它。
#   故必须先克隆 OptiScaler 源码树并初始化 FidelityFX-SDK-v2 子模块，
#   否则 CMake 会以 "FidelityFX ffx-api headers were not found" 直接失败。
#   该克隆与子模块初始化由下方 "Fetch OptiScaler source tree" step 完成。
#
#   NVIDIA NGX（DLSS）后端：头文件随仓库分发（Dx11FsrBridge/third_party/ngx/，许可与
#   来源见该目录 NOTICE.md），故 CMake 的 DX11FSRBRIDGE_ENABLE_NGX 默认 ON 会真正生效，
#   发布包里的 Bridge 不再是 NGX OFF 构型。
#   ⚠️ 这是有意的：此前发布包静默降级为 NGX OFF，用户设 Ffx12Backend=ngx 只会回落 native，
#   且 CI 不报警。故下方新增正向断言 —— 包里找不到 NGX 字符串就让构建失败。

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the generated 7z to GitHub Releases
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to create or update when publishing (for example v1.0.9)
        required: false
        type: string
      release_notes:
        description: Release notes body (Markdown). Used as-is when publishing.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 取得 OptiScaler 源码树（提供 Dx11FsrBridge 需要的 FidelityFX SDK 头文件）。
      # 只初始化 FidelityFX-SDK-v2 一个子模块：其余子模块（vulkan/spdlog/xess 等）
      # 本构建不需要，全量递归会显著拖慢 CI。
      #
      # 注意：这里必须做**正常检出**（不能加 --no-checkout）——子模块更新依赖工作树。
      # 用 --depth 1 控制体积。
      - name: Fetch OptiScaler source tree (FidelityFX SDK headers)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'OptiScaler-src'
          git clone --depth 1 https://github.com/optiscaler/OptiScaler.git $dest
          git -C $dest submodule update --init --depth 1 -- external/FidelityFX-SDK-v2
          $kit = Join-Path $dest 'external\FidelityFX-SDK-v2\Kits\FidelityFX'
          if (-not (Test-Path (Join-Path $kit 'api\include\ffx_api.h'))) {
            throw "FidelityFX SDK headers missing under $kit"
          }
          if (-not (Test-Path (Join-Path $kit 'upscalers\include\ffx_upscale.h'))) {
            throw "FidelityFX upscaler headers missing under $kit"
          }
          Write-Host "FidelityFX SDK headers ready: $kit"

      # 不再使用 ilammy/msvc-dev-cmd：Build-OnlineInstaller.ps1 自身会通过 vswhere
      # 定位 VS 并导入 vcvars64.bat（脚本第 58-76 行），双重初始化是冗余。
      - name: Build GitHub release package
        shell: pwsh
        run: ./Build-OnlineInstaller.ps1 -Configuration Release -GithubOnly

      # 正向断言：发布包必须真的带 NGX 后端。
      # 判据取**已生成的发布包**（dist\github-release\*.7z）里的 Bridge DLL —— 构建目录里有 NGX
      # 字符串不代表它被拷进了包；打包用的中间 stage 目录在 Build-FpsPackage 结束时已删除。
      # 缺任一字符串即说明本次构建降级成了 NGX OFF（例如入库头文件被删、CMake 判据被改），
      # 此时用户在 ini 里写 Ffx12Backend=ngx 会静默回落 native，只有日志里一行
      # "ngx_core init ok=0"。宁可在打包阶段失败。
      - name: Verify NGX backend is present in the packaged bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem -LiteralPath 'dist\github-release' -Filter 'GenshinFSRBridge_v*.7z' |
              Sort-Object LastWriteTime | Select-Object -Last 1
          if ($null -eq $archive) { throw 'no dist\github-release\GenshinFSRBridge_v*.7z produced' }
          # 与 Build-OnlineInstaller.ps1 相同的 7-Zip 解析顺序（tools\7zip 不随仓库分发）
          $sevenZip = @('tools\7zip\7z.exe', 'C:\Program Files\7-Zip\7z.exe', 'C:\Program Files (x86)\7-Zip\7z.exe') |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $sevenZip) { $sevenZip = (Get-Command '7z.exe' -ErrorAction Stop).Source }
          $out = Join-Path $env:RUNNER_TEMP 'ngx-verify'
          Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue
          # 只取出这一个成员（给出包内相对路径即可，7z 会保留目录结构）
          & $sevenZip x $archive.FullName 'payload\Bridge\Dx11FsrBridge.dll' "-o$out" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed ($LASTEXITCODE): $($archive.Name)" }
          $dll = Join-Path $out 'payload\Bridge\Dx11FsrBridge.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
              throw "missing payload\Bridge\Dx11FsrBridge.dll inside $($archive.Name)"
          }
          $bytes = [IO.File]::ReadAllBytes($dll)
          # 宽字符串必须按 UTF-16 查（AGENTS.md §四.A）
          $uni = [Text.Encoding]::Unicode.GetString($bytes)
          foreach ($needle in @('Ffx12Backend', 'NgxRenderPreset', 'NgxHdr', 'ngx_hdr_decision')) {
              if (-not $uni.Contains($needle)) {
                  throw "NGX string '$needle' missing from the packaged bridge - this build downgraded to NGX OFF"
              }
          }
          Write-Host "NGX backend present in $($archive.Name) (bridge $($bytes.Length) bytes)"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinFSRBridge-Package
          path: dist/github-release/GenshinFSRBridge_v*.7z
          if-no-files-found: error

      - name: Validate release tag
        if: inputs.publish_release && inputs.release_tag == ''
        shell: pwsh
        run: throw '发布到 Release 时必须填写 release_tag。'

      - name: Publish release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: ${{ inputs.release_notes }}
          files: |
            dist/github-release/GenshinFSRBridge_v*.7z
