<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="原神 DX11 原生 FSR2 调用经 Dx11FsrBridge 转接到 AMD FFX12 SDK（FSR4/FSR3/FSR2）或 NVIDIA NGX（DLSS），输出超分画面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0b1528"/>
      <stop offset="1" stop-color="#101f3a"/>
    </linearGradient>
    <linearGradient id="titleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="0.55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b7ea8"/>
    </marker>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1120" cy="20" r="240" fill="url(#glowViolet)"/>
  <circle cx="60" cy="320" r="220" fill="url(#glowCyan)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
    <!-- 左上角标签 -->
    <rect x="64" y="52" width="212" height="30" rx="15" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="170" y="72" text-anchor="middle" font-size="12" letter-spacing="2.4" fill="#7dd3fc">WINDOWS · DX11 · GPL-3.0</text>

    <!-- 主视觉 -->
    <text x="64" y="150" font-size="44" font-weight="700" letter-spacing="-0.5" fill="url(#titleAccent)">FSR4 · FSR3 · FSR2 <tspan fill="#9ae04a">· DLSS</tspan></text>
    <text x="66" y="188" font-size="20" fill="#9db4d0">原神 DX11 · 原生 FSR2 调用 → FFX12 / NGX 双后端超分</text>

    <!-- 特性标签 -->
    <g font-size="14">
      <rect x="64" y="210" width="146" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="137" y="233" text-anchor="middle" fill="#cfe3ff">Windows DX11</text>
      <rect x="222" y="210" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="302" y="233" text-anchor="middle" fill="#cfe3ff">无需 OptiScaler</text>
      <rect x="394" y="210" width="134" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="461" y="233" text-anchor="middle" fill="#cfe3ff">Genshin 7.1+</text>
      <rect x="540" y="210" width="140" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="610" y="233" text-anchor="middle" fill="#cfe3ff">可选 DLSS</text>
    </g>

    <text x="64" y="302" font-size="12" letter-spacing="1.2" fill="#5f7a99">AMD FFX12 SDK · NVIDIA NGX SDK · Microsoft Detours · 3DMigoto 兼容纹理加载</text>

    <!-- 右侧链路示意：同一个 HOOK 之后分叉到两条后端 -->
    <rect x="744" y="44" width="472" height="248" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="772" y="74" font-size="11" letter-spacing="2.4" fill="#6b8bb0">RENDER PIPELINE</text>

    <!-- 节点：桥 -->
    <rect x="772" y="120" width="116" height="96" rx="14" fill="#0e1a2e" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text x="830" y="158" text-anchor="middle" font-size="11" fill="#6b8bb0">Dx11FsrBridge</text>
    <text x="830" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf3ff">HOOK</text>

    <!-- 分叉箭头（上：NGX，下：FFX12） -->
    <path d="M888 168 H910 V129 H936" fill="none" stroke="#5b7ea8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M888 168 H910 V207 H936" fill="none" stroke="#5b7ea8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 后端 1：NVIDIA NGX → DLSS -->
    <rect x="940" y="92" width="252" height="74" rx="14" fill="#0e1a2e" stroke="#76b900" stroke-opacity="0.55"/>
    <text x="960" y="124" font-size="11" letter-spacing="1.4" fill="#6b8bb0">NVIDIA NGX</text>
    <text x="960" y="152" font-size="18" font-weight="700" fill="#eaf3ff">DLSS</text>

    <!-- 后端 2：AMD FFX12 → FSR4 / FSR3 / FSR2 -->
    <rect x="940" y="170" width="252" height="74" rx="14" fill="#0e1a2e" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="960" y="202" font-size="11" letter-spacing="1.4" fill="#6b8bb0">AMD FFX12</text>
    <text x="960" y="230" font-size="18" font-weight="700" fill="#eaf3ff">FSR4 / FSR3 / FSR2</text>

    <!-- 可选扩展 -->
    <rect x="772" y="252" width="420" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.30" stroke-dasharray="4 4"/>
    <text x="788" y="270" font-size="12" fill="#a9a4d6">可选：接入 OptiScaler 扩展 XeSS / FSR4 INT8 / 帧生成</text>

    <text x="1216" y="302" text-anchor="end" font-size="12" fill="#5f7a99">github.com/AizawaHikaru233</text>
  </g>
</svg>
