; ============================================================
;  TextureLoader 配置 / TextureLoader configuration
;  放在 DLL 同目录，重启游戏生效。
; Place beside the DLL; takes effect after restarting the game.
;  轻量 D3D11 纹理替换 DLL：hook CreateTexture2D 与各着色器阶段的 SetShaderResources，按 3DMigoto 兼容哈希匹配 [TextureOverride] hash=，用同名 .dds（CPU）/ .gdds（DirectStorage GPU 解压）替换游戏纹理。
; Lightweight D3D11 texture replacement DLL: hooks CreateTexture2D and SetShaderResources, matches 3DMigoto-compatible hashes from [TextureOverride] hash=, and replaces game textures with same-named .dds (CPU) / .gdds (DirectStorage GPU decompression) files.
;  下列键全部可选，留空即用默认值。
; All keys are optional; leave blank to use the default.
; ============================================================

; --- 路径与加载 / Paths and loading ---

; mods_dir —— Mods 根目录（递归扫描全部 ini）；留空 = DLL 同目录的 Mods 子目录（不存在则自动创建为空）。
; Mods root directory, scanned recursively for ini files; blank = "Mods" beside the DLL (created empty if missing).
mods_dir =

; gdds_enabled —— GDDS（DirectStorage GPU 解压）开关；1 = 启用（默认），0 = 关闭。
; GDDS (DirectStorage GPU decompression) switch; 1 = enabled (default), 0 = disabled.
gdds_enabled = 1

; --- 性能与显存 / Performance and VRAM ---

; max_texture_side —— 替换纹理最大边长（像素）；0 = 不限制（默认），>0 = 超过该边长保留原版。
; Max side length (pixels) of a replacement texture; 0 = unlimited (default), >0 = keep the original above this side.
max_texture_side = 0

; vram_threshold —— 显存危急阈值（可用显存低于此值进入紧急回收）；留空 = 自适应（默认，4GB→20%，8GB→18.6%，16GB→15.8%，24GB→13%），也可显式指定 15%（=总显存 15%）或 1024M / 2G（无后缀按 MB）。越接近阈值回收越积极（闲置阈值 10 分钟→30 秒，每轮 2→32 条）。
; Critical VRAM threshold; below it emergency cache eviction starts. Blank = adaptive (default, 4GB->20%, 8GB->18.6%, 16GB->15.8%, 24GB->13%); or set explicitly as 15% of total VRAM, or 1024M / 2G (no suffix = MB). Eviction gets more aggressive near the threshold (idle 10min->30s, 2->32 entries per pass).
vram_threshold =

; async_load —— 纹理加载方式；留空 = 自动（默认：NVIDIA→同步，AMD/Intel→异步），0 = 强制同步（渲染线程建纹理，兼容性最好，加载瞬间可能卡顿），1 = 强制异步（后台线程建纹理，加载/切角色更流畅）。
; Texture loading mode; blank = auto (default: NVIDIA->sync, AMD/Intel->async), 0 = force sync (create on the render thread; best compatibility, may hitch), 1 = force async (create on a worker thread; smoother loading).
async_load =

; --- 日志与调试 / Logging and diagnostics ---

; log_level —— 日志详细度（写 DLL 同目录 TextureLoader.log，每次覆盖）；0 = 仅关键（错误/警告/崩溃/配置），1 = 常规（默认，额外记录 [HIT]/[srv] 替换事件），2 = 详细（额外记录各路径细节）。
; Log verbosity (writes TextureLoader.log beside the DLL, overwritten each run); 0 = essentials only, 1 = normal (default, also logs [HIT]/[srv] events), 2 = verbose (also per-path details).
log_level = 1

; observe_only —— 观察模式；0 = 真正加载 dds/gdds 并替换（默认），1 = 只记录哈希匹配（[HIT] 日志）、不替换。
; Observe-only mode; 0 = actually load dds/gdds and replace (default), 1 = log hash matches only ([HIT]), no replacement.
observe_only = 0