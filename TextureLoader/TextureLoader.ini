; ============================================================
;  TextureLoader 配置（放 DLL 同目录，重启游戏生效）
; ============================================================
; 轻量 D3D11 纹理替换 DLL：hook CreateTexture2D + 各着色器阶段
; SetShaderResources，用 3DMigoto 兼容哈希匹配 [TextureOverride] hash=，
; 加载同名 .dds（CPU）/ .gdds（DirectStorage GPU 解压）替换游戏纹理。
;
; 所有键均为可选项，缺省使用默认值（见下方每项说明）。

; ------------------------------------------------------------
; mods_dir —— Mods 根目录（递归扫描全部 ini）
;   指向包含 [TextureOverride]/[Resource] 配置的根目录
;   （如 XXMI 的 GIMI\Mods）。留空/缺省 = 使用 DLL 所在目录的
;   Mods 子目录（不存在会自动创建空的，把 mod 放进去即可）。
; ------------------------------------------------------------
mods_dir =

; ------------------------------------------------------------
; observe_only —— 观察模式
;   0 = 真正加载 dds/gdds 并替换（默认）
;   1 = 只记录哈希匹配（[HIT] 日志），不创建/绑定替换纹理。
;       用于验证哈希是否命中、或排查"替换是否引起问题"。
; ------------------------------------------------------------
observe_only = 0

; ------------------------------------------------------------
; log_level —— 日志详细度（写 DLL 同目录 TextureLoader.log，
;   每次运行覆盖上一次日志）
;   0 = 仅关键（错误/警告/崩溃/配置）
;   1 = 常规（默认）：额外记录 [HIT]/[srv] 替换事件
;   2 = 详细：额外记录各路径细节（排查用，IO 开销略增）
; ------------------------------------------------------------
log_level = 1

; ------------------------------------------------------------
; vram_threshold —— 显存危急阈值（可用显存低于此值进入紧急回收）
;   留空 = 自适应（默认）：按显存容量自动推导临界百分比
;          （4GB→20%，8GB→18.6%，16GB→15.8%，24GB→13%）
;   也可显式指定（覆盖自适应）：
;     15%       可用显存 < 总显存 15%
;     1024M / 2G 可用显存低于指定容量（无后缀数字按 MB）
;   回收全程渐进：剩余显存较多时只回收闲置最久的缓存，越接近
;   临界值回收越积极（闲置阈值 10 分钟→30 秒，每轮 2→32 条）。
; ------------------------------------------------------------
vram_threshold =

; ------------------------------------------------------------
; max_texture_side —— 替换纹理最大边长（像素）
;   0 = 不限制（默认）
;   >0 = 超过该边长的纹理保留原版不替换（省显存/加载带宽），
;        如 8192 表示跳过 8193 以上的超大纹理。
; ------------------------------------------------------------
max_texture_side = 0

; ------------------------------------------------------------
; gdds_enabled —— GDDS（DirectStorage GPU 解压）开关
;   1 = 启用（默认）：.gdds 走 DirectStorage GPU GDeflate 解压
;   0 = 禁用：.gdds 跳过不替换，仅 .dds 生效
;        （个别显卡驱动对 GDDS 共享纹理有缺陷时可设 0 规避）
; ------------------------------------------------------------
gdds_enabled = 1

; ------------------------------------------------------------
; async_load —— 纹理加载方式
;   留空 = 自动（默认）：按 GPU 厂商选择——
;     NVIDIA：同步（渲染线程建纹理，规避驱动对后台线程建纹理的缺陷）
;     AMD/Intel：异步（后台线程加载，避免渲染线程阻塞导致 GPU 空转）
;   0 = 强制同步：渲染线程创建纹理（3DMigoto 同模型，兼容性最好，
;       但加载瞬间可能有卡顿，GPU 负载可能不满）
;   1 = 强制异步：后台线程创建纹理（加载/切角色更流畅；若遇驱动
;       崩溃/卡死请改回自动或 0）
; ------------------------------------------------------------
async_load =
