; ============================================================
;  TextureLoader 配置 / TextureLoader configuration
;  放在 DLL 同目录，重启游戏生效。
;  Place beside the DLL; takes effect after restarting the game.
;
;  轻量 D3D11 纹理替换 DLL：hook CreateTexture2D 与各着色器阶段的
;  SetShaderResources，按 3DMigoto 兼容哈希匹配 [TextureOverride] hash=，
;  用同名 .dds（CPU）/ .gdds（DirectStorage GPU 解压）替换游戏纹理。
;  Lightweight D3D11 texture replacement DLL: hooks CreateTexture2D and
;  SetShaderResources, matches 3DMigoto-compatible hashes from
;  [TextureOverride] hash=, and replaces game textures with same-named
;  .dds (CPU) / .gdds (DirectStorage GPU decompression) files.
;
;  下列键全部可选，留空即用默认值。
;  All keys are optional; leave blank to use the default.
; ============================================================

; ------------------------------------------------------------
; 路径与加载 / Paths and loading
; ------------------------------------------------------------

; mods_dir —— Mods 根目录（递归扫描全部 ini）
;   Mods root directory, scanned recursively for ini files.
;   留空 = DLL 同目录的 Mods 子目录（不存在会自动创建空的）。
;   Blank = "Mods" beside the DLL (created empty if missing).
mods_dir =

; gdds_enabled —— GDDS（DirectStorage GPU 解压）开关
;   GDDS (DirectStorage GPU decompression) switch.
;   1 = 启用（默认）；个别显卡驱动对 GDDS 共享纹理有缺陷时可设 0 规避。
;   1 = enabled (default); set 0 to dodge driver bugs with shared textures.
gdds_enabled = 1


; ------------------------------------------------------------
; 性能与显存 / Performance and VRAM
; ------------------------------------------------------------

; max_texture_side —— 替换纹理最大边长（像素）
;   Max side length (pixels) of a replacement texture.
;   0 = 不限制（默认）；>0 = 超过该边长保留原版，省显存/加载带宽。
;   0 = unlimited (default); >0 = keep the original above this side.
max_texture_side = 0

; vram_threshold —— 显存危急阈值（可用显存低于此值进入紧急回收）
;   Critical VRAM threshold; below it emergency cache eviction starts.
;   留空 = 自适应（默认，4GB→20%，8GB→18.6%，16GB→15.8%，24GB→13%）。
;   Blank = adaptive (default, 4GB->20%, 8GB->18.6%, 16GB->15.8%, 24GB->13%).
;   也可显式指定：15% = 总显存 15%；1024M / 2G = 指定容量（无后缀按 MB）。
;   Or set explicitly: 15% of total VRAM, or 1024M / 2G (no suffix = MB).
;   越接近临界值回收越积极（闲置阈值 10 分钟→30 秒，每轮 2→32 条）。
;   Eviction gets more aggressive near the threshold (idle 10min->30s,
;   2->32 entries per pass).
vram_threshold =

; async_load —— 纹理加载方式
;   Texture loading mode.
;   留空 = 自动（默认）：NVIDIA→同步（规避驱动后台线程建纹理缺陷），
;          AMD/Intel→异步（避免渲染线程阻塞导致 GPU 空转）。
;   Blank = auto (default): NVIDIA->sync (driver bug workaround),
;           AMD/Intel->async (avoid stalling the render thread).
;   0 = 强制同步：渲染线程建纹理（3DMigoto 同模型，兼容性最好，加载瞬间
;       可能卡顿）。
;   0 = force sync: create on the render thread (best compatibility, may hitch).
;   1 = 强制异步：后台线程建纹理（加载/切角色更流畅；遇驱动崩溃/卡死改回
;       自动或 0）。
;   1 = force async: create on a worker thread (smoother; revert if it crashes).
async_load =


; ------------------------------------------------------------
; 日志与调试 / Logging and diagnostics
; ------------------------------------------------------------

; log_level —— 日志详细度（写 DLL 同目录 TextureLoader.log，每次覆盖）
;   Log verbosity; writes TextureLoader.log beside the DLL, overwritten each run.
;   0 = 仅关键（错误/警告/崩溃/配置）。
;   0 = essentials only (errors, warnings, crashes, config).
;   1 = 常规（默认）：额外记录 [HIT]/[srv] 替换事件。
;   1 = normal (default): also logs [HIT]/[srv] replacement events.
;   2 = 详细：额外记录各路径细节（IO 开销略增）。
;   2 = verbose: also logs per-path details (slightly more IO).
log_level = 1

; observe_only —— 观察模式
;   Observe-only mode.
;   0 = 真正加载 dds/gdds 并替换（默认）。
;   0 = actually load dds/gdds and replace (default).
;   1 = 只记录哈希匹配（[HIT] 日志），不替换；用于验证哈希是否命中。
;   1 = log hash matches only ([HIT]), no replacement; verifies hit/miss.
observe_only = 0
