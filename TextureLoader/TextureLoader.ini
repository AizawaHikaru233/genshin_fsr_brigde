; TextureLoader 配置（放 DLL 同目录）
; 轻量 D3D11 纹理替换版：hook CreateTexture2D + PSSetShaderResources，
; 用 3DMigoto 兼容哈希匹配 [TextureOverride] hash=，加载同名 dds/gdds 替换。

; Mods 目录：指向包含 mod ini 的根目录（如 XXMI 的 GIMI\Mods），会递归扫描
mods_dir = C:\path\to\your\Mods

; observe_only：1=只记录哈希匹配，不真正替换（先验证哈希正确性）
;               0=真正加载 dds/gdds 替换纹理
observe_only = 0

; log_level：0=仅关键日志（错误/警告/崩溃） 1=常规（默认） 2=详细
; 高频日志（[HIT]/[srv]/[gdds] 细节）仅在 >=1 时输出，便于长时间挂机减少 IO
log_level = 1

; vram_threshold：显存压力阈值（可用显存低于该值开始淘汰替换缓存，未达阈值
; 不积极清理，保证游戏流畅）。支持：
;   百分比：15%        （可用显存 < 总显存 15%，默认）
;   具体容量：1024M / 2G（可用显存低于指定容量；无后缀数字按 MB）
; 空值或非法（<=0/非数字）自动回退默认 15%
vram_threshold = 15%

; max_texture_side：替换纹理最大边长（像素）；0=不限制（默认）
; 大于此边长的纹理保留原版不替换（节省显存/加载带宽）。例如 8192
max_texture_side = 0
