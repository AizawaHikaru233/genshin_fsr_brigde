[General]
Name = 原神FSR2桥接插件
Description = 支持把原神的FSR2转换为FSR4（A卡7000/9000）、DLSS/XeSS/FSR4 INT8（其余显卡）
Developer = シリアCelia
File = FSR-Bridge-Plugin.dll
Version = 2.2.0

[EnableBridge]
Name = 启用 FSR Bridge
Type = bool
Value = 1

[EnableOptiScaler]
Name = 启用 OptiScaler（需要 Bridge）
Type = bool
Value = 1

[EnableReShade]
Name = 启用 ReShade
Type = bool
Value = 0

; TextureLoader（纹理/Mod 加载器）：可选组件，默认关闭，可手动开启。
; NVIDIA 显卡上不推荐启用：N 卡极大概率会出现替换的贴图纹理 mod 加载丢失的问题，
; 而不是完全不可用；但不推荐用，运气好的时候可以正常使用，没有找到特定条件。
; 所有自动路径（安装、还原配置、配置缺省）都不会开启它，只有显式打开本开关才会加载。
[EnableTextureLoader]
Name = 启用纹理/Mod 加载器（N 卡不推荐：可能加载丢失，非完全不可用）
Type = bool
Value = 0

